# Persist —— Nginx 站点配置（HTTPS 阶段，备案号下发后启用）
#
# 本文件在**备案号下发、域名解析生效、证书签发成功**后才部署到生产。
# 部署顺序与命令见 docs/部署与服务器现状.md §4「域名与备案」。
#
# 部署位置：/etc/nginx/conf.d/persist-tls.conf
# 前置条件：
#   1. 阿里云 DNS：wpersist.top / www.wpersist.top → ECS 公网 IP
#   2. 安全组：入方向 443/tcp 已放行
#   3. 证书：/etc/letsencrypt/live/wpersist.top/{fullchain.pem,privkey.pem} 已存在
#   4. 续期：certbot-renew.timer 已 enable --now
#
# 验证：nginx -t && systemctl reload nginx

server {
    # HTTP/2 用 listen 参数开启：`http2 on;` 是 Nginx 1.25.1+ 才有的独立指令，
    # 本机是 1.24.0，用独立指令会直接 unknown directive 导致 nginx -t 失败
    # （2026-11-19 实测）。1.24 上必须写成 listen ... ssl http2。
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # www 与裸域同时签进证书（SAN 双签），避免 www.wpersist.top 证书不匹配。
    # 两个域名指向同一份内容，canonical 标签统一指向 https://wpersist.top/。
    server_name wpersist.top www.wpersist.top;

    ssl_certificate     /etc/letsencrypt/live/wpersist.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wpersist.top/privkey.pem;

    # TLS 1.2 起步（PCI 与主流客户端基线），TLS 1.3 由 OpenSSL 自行协商。
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP 装订：Let's Encrypt 签发的证书带 OCSP 地址。
    # stapling 需要 DNS 解析器（certbot 续期与 Nginx 启动都要用），
    # 这里用阿里云内网 DNS，与服务器实际解析配置一致。
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/wpersist.top/chain.pem;
    resolver 100.100.2.136 100.100.2.138 valid=300s;
    resolver_timeout 5s;

    root /var/www/persist;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # 基础安全响应头（2026-11-25 安全审查）。
    # 注意 nginx 的 add_header 继承规则：location 内只要出现任意 add_header，
    # 就不再继承 server 层。下面两个带 Cache-Control 的资源 location 已各自重复整组头。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 覆盖而非追加，避免采信客户端自填的 X-Forwarded-For（2026-11-18 修复）。
        proxy_set_header X-Forwarded-For $remote_addr;
        # HTTPS 下 $scheme = https，后端据此判断来源协议。
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # SSE（/api/chat）不能被缓冲；/api/report 的长请求共用同一 location。
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ~* "^/(assets|design)/" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        access_log off;
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    location = /home.html {
        expires -1;
    }

    location = /app {
        return 301 /app/;
    }

    location = /app/index.html {
        expires -1;
    }

    location ^~ /app/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=()" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        access_log off;
        try_files $uri =404;
    }

    location ^~ /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
