# Persist —— Nginx 站点配置（HTTP 阶段，备案号下发前）
#
# 与生产 /etc/nginx/conf.d/persist.conf 保持一致。
# 本文件是「唯一事实来源」：改这里 → 同步到服务器 → nginx -t → reload。
#
# 部署位置：/etc/nginx/conf.d/persist.conf
# 验证：    nginx -t && systemctl reload nginx
#
# ---
# ACME HTTP-01 挑战路径（certbot webroot 模式）：
#   location ^~ /.well-known/acme-challenge/ 必须置于兜底的 location / 之前。
#   兜底的 try_files $uri $uri/ /index.html 会把挑战令牌回退成落地页 HTML，
#   验证服务器拿到 HTML 而不是令牌，签发必然失败（这是 2026-11-19 实测确认的坑）。
#   webroot 目录：/var/www/certbot（与 certbot --webroot -w 参数一致）

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/persist;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # 基础安全响应头（2026-11-25 安全审查）。
    # 注意 nginx 的 add_header 继承规则：location 内只要出现任意 add_header，
    # 就不再继承 server 层。所以下面每个带 Cache-Control 的 location 都重复了这组头。
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=()" always;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 必须用 $remote_addr 覆盖，不能用 $proxy_add_x_forwarded_for 追加：
        # 追加会把客户端自己填的 X-Forwarded-For 保留在前面，后端取最左值
        # 就等于采信了伪造来源，按 IP 的限流可被逐次换头绕过（2026-11-18 修复）。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ACME HTTP-01 挑战路径：必须用 ^~ 精确前缀，且排在兜底 location / 之前。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location ~* "^/(assets|design)/" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=()" always;
        access_log off;
        try_files $uri =404;
    }

    # 开场手势的 MediaPipe 资源（≈22 MB）：/fusion/ 下只有 .mjs / .js / .wasm / .json / .task。
    # 必须显式给 .mjs 与 .js 正确的 JS 类型 —— Nginx 1.24 的 mime.types 里**没有 mjs**，
    # 默认落到 application/octet-stream，浏览器会拒绝动态 import()
    # （2026-11-23 部署实测：/fusion/mediapipe/vision_bundle.mjs 返回 octet-stream，手势必挂）。
    # 这里的 types{} 只覆盖该 location，不影响别的路径。
    # 文件名不带 hash，所以给 7 天缓存；升级 MediaPipe 时要换目录名或加查询参数破缓存。
    location ^~ /fusion/ {
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=()" always;
        types {
            text/javascript   mjs js;
            application/wasm  wasm;
            application/json  json;
            text/plain        txt;
        }
        try_files $uri =404;
    }

    location = /index.html {
        expires -1;
    }

    location = /home.html {
        expires -1;
    }

    location = /app {
        return 301 /app/;
    }

    location = /app/index.html {
        expires -1;
    }

    # React web hashed 资源长缓存
    location ^~ /app/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), microphone=()" always;
        access_log off;
        try_files $uri =404;
    }

    # /app/* 深链回退到 React web
    location ^~ /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    # 根路径只回退落地页，不把未知路径误送进 React app
    location / {
        try_files $uri $uri/ /index.html;
    }
}
