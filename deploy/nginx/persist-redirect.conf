# Persist —— Nginx 域名跳转（HTTPS 阶段，备案号下发后启用）
#
# 只在 server_name 精确匹配 wpersist.top 时生效；
# persist.conf 里的 default_server（server_name _）继续用 IP 提供 HTTP 服务，
# 两者互不干扰。备案期间不部署本文件。
#
# 部署位置：/etc/nginx/conf.d/persist-redirect.conf
#
# ---
# 为什么 /api/ 用 308 而不是 301：
#   301 / 302 会让多数客户端把 POST 改写成 GET 并丢弃请求体，
#   /api/chat 的 SSE 请求体会直接丢失，表现为「服务端收到空消息」。
#   308 Permanent Redirect 保留方法与请求体，语义上才是「换个地址再来一次」。
#   页面请求用 301 是为了缓存友好，方法丢弃无所谓。

server {
    listen 80;
    listen [::]:80;
    server_name wpersist.top;

    # ACME HTTP-01 挑战路径必须留在 80 上（Let's Encrypt 只走 80 验证），
    # 且不能被跳转拦掉。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    # API 用 308：保留 POST 方法与请求体。
    location /api/ {
        return 308 https://$host$request_uri;
    }

    # 其余页面请求用 301（缓存友好）。
    location / {
        return 301 https://$host$request_uri;
    }
}
