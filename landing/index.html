<!DOCTYPE html>
<html lang="zh-CN" class="no-js">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05070d">
<title>Persist</title>
<meta name="description" content="把每一天记下来，让 AI 告诉你规律。数据存在你自己的设备上。">
<meta name="robots" content="index,follow">
<link rel="preload" as="image" type="image/webp" imagesizes="100vw"
      imagesrcset="assets/starfield-wide-1280.webp 1280w, assets/starfield-wide-1920.webp 1920w, assets/starfield-wide-2560.webp 2560w, assets/starfield-wide-3000.webp 3000w"
      href="assets/starfield-wide-1920.webp" media="(min-aspect-ratio: 1/1)">
<link rel="preload" as="image" type="image/webp" imagesizes="100vw"
      imagesrcset="assets/starfield-tall-720.webp 720w, assets/starfield-tall-1080.webp 1080w, assets/starfield-tall-1440.webp 1440w"
      href="assets/starfield-tall-1080.webp" media="(max-aspect-ratio: 1/1)">
<style>
/* ============================================================
   落地页（入口页）
   底图：WebP q84 —— 细节保留 99%，最大档 3000px 原生零放大
   星轨：几何圆弧法（每帧 clearRect 重绘，无残影累积）
   流星：移植「流星雨效果.html」的 Meteor 模型（渐变尾迹 + 头部光晕）
   文案：移植「Hello world Sacramento 水平路径.html」的
         SVG 遮罩扫描 + 笔尖光点 + easeInOutCubic
   ============================================================ */

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;overflow:hidden;background:#05070d;color:#eef4ff;
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  height:100vh;height:100dvh;
}

/* ---------- 1. 底图 ----------
   LQIP 挂在容器上（不参与淡入）：首帧先出模糊的星空占位，真图解码后淡入，
   两者同构，所以不会有黑屏闪，也不会出现「只有底色」的暗帧。 */
.stage{position:fixed;inset:0;overflow:hidden;background:#05070d}
.bg{
  position:absolute;inset:0;display:block;
  /* 24x14 极小占位（同图 WebP，86 字节） */
  background:#05070d url("data:image/webp;base64,UklGRnQAAABXRUJQVlA4IGgAAACwAQCdASoYAA4APsFQoUqnpKMhsAgA8BgJQBOmUABwcpuAAP72VoiTuhQA")
             no-repeat center 42%/cover;
}
.bg img{
  width:100%;height:100%;object-fit:cover;object-position:50% 42%;
  animation:bgIn 1100ms ease-out both;
}
@keyframes bgIn{from{opacity:0}to{opacity:1}}

/* ---------- 2. 压暗层 ----------
   比旧版轻很多：旧版中心椭圆压暗 .62 + 两层线性压暗把照片细节整体吞掉。
   现在只在边缘压暗，中间留给照片本身，文案靠自身发光拉开对比。 */
.scrim{
  position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(122% 92% at 50% 44%,rgba(4,6,12,0) 30%,rgba(3,5,10,.30) 72%,rgba(2,3,7,.72) 100%),
    linear-gradient(180deg,rgba(3,5,10,.50) 0%,rgba(3,5,10,.04) 33%,rgba(2,3,7,.10) 62%,rgba(2,3,7,.62) 100%);
}

/* ---------- 3. Canvas：透明层，只画星轨与流星 ---------- */
#sky{position:absolute;inset:0;width:100%;height:100%;display:block}

/* ---------- 4. 文案 ---------- */
.copy{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  padding:0 3vw;pointer-events:none;
}
/* 文案正后方一层很淡的椭圆压暗，保证星轨穿过时字仍读得清 */
.copy::before{
  content:"";position:absolute;left:50%;top:50%;translate:-50% -50%;
  width:min(1180px,98vw);height:min(520px,60vh);pointer-events:none;
  background:radial-gradient(closest-side,rgba(2,4,9,.50),rgba(2,4,9,.14) 60%,rgba(2,4,9,0));
}
.word{
  position:relative;display:block;width:min(88vw,1080px);height:auto;
  overflow:visible;
}
/* 有 JS 时先藏起来，测量定位完成再加 .ready 一次性显示，避免首帧字形跳动
   刻意不用 transition：透明度若停在中间态会让文案整段消失，直接切换最稳 */
html.js .word{opacity:0}
html.js .copy.ready .word{opacity:1}

.line,.mask-path{fill:none;stroke-linecap:round;stroke-linejoin:round}
/* 基线上的细渐变线，与文字同步生长 */
.line{stroke:url(#lineGrad);stroke-width:1.15;opacity:.85}
/* 遮罩用的粗线：只当扫描头，本身永不可见 */
.mask-path{stroke:#fff;stroke-width:120;stroke-linecap:butt}
/* 文字：只用系统手写体，零外部字体请求 */
.copy-text{
  font-family:"Sacramento","Lucida Handwriting","Segoe Script","Apple Chancery",
              "Snell Roundhand","Segoe Print","Ink Free","Brush Script MT",cursive;
  font-size:96px;font-weight:400;letter-spacing:.5px;
  fill:#f6faff;
  filter:drop-shadow(0 0 6px rgba(206,232,255,.62)) drop-shadow(0 0 30px rgba(118,172,255,.40));
}
#pen{fill:#eaf8ff;filter:drop-shadow(0 0 8px rgba(150,214,255,.95))}

/* 提示：绝对定位在文案下方，不参与居中计算，避免把文案整体顶偏 */
.hint{
  position:absolute;left:50%;bottom:clamp(7vh,9.5vh,15vh);translate:-50% 0;
  margin:0;font-size:clamp(11px,1.1vw,13px);letter-spacing:.36em;text-indent:.36em;
  color:rgba(214,229,247,0);opacity:0;white-space:nowrap;text-align:center;
  transition:color 900ms ease,opacity 900ms ease;
}
.hint.on{opacity:1;color:rgba(214,229,247,.66);animation:breathe 3.8s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.52}50%{opacity:.94}}

/* ---------- 6. 全屏点击层 ---------- */
.enter{position:absolute;inset:0;display:block;outline:none;cursor:pointer;-webkit-tap-highlight-color:transparent}
.enter:focus-visible{box-shadow:inset 0 0 0 2px rgba(150,195,255,.62)}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip-path:inset(50%);white-space:nowrap}

/* 进入首页 */
.stage{transition:opacity 360ms ease,transform 360ms ease}
.stage.leaving{opacity:0;transform:scale(1.03)}

/* ---------- 7. 降级 ---------- */
.nojs{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:22px;background:#05070d;color:#eef4ff;font-size:15px}
.nojs a{color:#8fc3e0;text-decoration:none;border-bottom:1px solid rgba(143,195,224,.45);padding-bottom:3px}
html.no-js .nojs{display:flex}
html.no-js .stage{display:none}

@media (prefers-reduced-motion:reduce){
  .bg img{animation:none}
  .hint.on{animation:none;opacity:.82}
  .stage{transition:none}
  html.js .copy.ready .word{transition:none}
}
</style>
</head>
<body>

<div class="stage" id="stage">
  <picture class="bg" aria-hidden="true">
    <!-- 横屏 16:9：最大档 3000 = 原图原生宽度，零放大；竖屏 9:16 -->
    <source media="(min-aspect-ratio:1/1)" type="image/webp"
            srcset="assets/starfield-wide-1280.webp 1280w,
                    assets/starfield-wide-1920.webp 1920w,
                    assets/starfield-wide-2560.webp 2560w,
                    assets/starfield-wide-3000.webp 3000w"
            sizes="100vw">
    <source type="image/webp"
            srcset="assets/starfield-tall-720.webp 720w,
                    assets/starfield-tall-1080.webp 1080w,
                    assets/starfield-tall-1440.webp 1440w"
            sizes="100vw">
    <img src="assets/starfield-wide-1920.webp" alt="" decoding="async" fetchpriority="high" width="1920" height="1080">
  </picture>

  <div class="scrim" aria-hidden="true"></div>
  <canvas id="sky" aria-hidden="true"></canvas>

  <div class="copy" id="copy">
    <svg class="word" id="word" viewBox="0 0 1200 420" role="img" aria-label="Hello world">
      <defs>
        <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#6d9fbd" stop-opacity="0"/>
          <stop offset=".22" stop-color="#6d9fbd" stop-opacity=".9"/>
          <stop offset="1" stop-color="#dff1ff" stop-opacity=".95"/>
        </linearGradient>

        <mask id="reveal" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse"
              x="0" y="0" width="1200" height="420">
          <rect width="1200" height="420" fill="#000"/>
          <!-- 用真实 path 而非 <use>：dash 设在 <use> 上部分内核不传递给克隆节点，
               会导致遮罩恒为全白、逐字揭示失效（整句同时出现） -->
          <path id="maskLine" class="mask-path" d="M 90 300 L 1110 300" fill="none"/>
        </mask>
      </defs>

      <path id="textLine" class="line" d="M 90 300 L 1110 300" fill="none"/>

      <text id="copyText" class="copy-text" mask="url(#reveal)" text-anchor="middle">
        <textPath href="#textLine" startOffset="50%">Hello world</textPath>
      </text>

      <circle id="pen" r="5" opacity="0"/>
    </svg>

    <p class="hint" id="hint">点击任意处进入</p>
  </div>

  <a class="enter" id="enter" href="home.html"><span class="sr">进入 Persist 首页</span></a>
</div>

<div class="nojs">
  <div style="font-size:34px;letter-spacing:.06em">Hello world</div>
  <a href="home.html">进入 Persist</a>
</div>

<script>
(function(){
  'use strict';
  document.documentElement.className = 'js';

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // 静态完成态：仅用于自检与截图，让 headless（虚拟时间下 rAF 不推进）也能看到终态
  var STILL = /[?&]still=1/.test(location.search) || reduce;

  /* =========================================================
     A. Canvas 星空：星轨（几何圆弧）+ 流星（移植参考实现）
     ========================================================= */
  var canvas = document.getElementById('sky');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, DPR = 1;
  var trails = [], meteors = [];
  var raf = 0, last = 0, running = false, spawnAcc = 0, started = false;
  var skyFrames = 0;

  var CFG = {
    trailMin: 90, trailMax: 210,      // 按面积自适应
    arcLen: [0.030, 0.150],           // 星轨弧的角跨度（弧度）
    omega: [0.0035, 0.0140],          // 公转角速度 rad/s（整圈约 9–30 分钟）
    growT: [5.0, 16.0],               // 弧长从初始比例长到满所需的秒数
    meteorCount: 20,
    meteorSpeed: [420, 900],
    meteorLength: [110, 260],
    meteorAngle: [118, 148],          // 度：向下偏左，与参考一致
    meteorWidth: [1.2, 2.8],
    meteorHue: [192, 216],            // 冷蓝
    spawnInterval: 0.13              // 每秒约 7.7 颗
  };

  var BUCKETS = [0.20, 0.38, 0.60, 0.86];   // 4 档亮度
  var SEGS = [                              // 星轨按 3 段做渐弱
    { f0: 0.00, f1: 0.55, a: 0.15, w: 0.75 },
    { f0: 0.55, f1: 0.85, a: 0.40, w: 1.15 },
    { f0: 0.85, f1: 1.00, a: 0.92, w: 1.70 }
  ];

  function rand(a, b){ return a + Math.random() * (b - a); }
  function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }

  // 极点位于画面正上方外部，所有星围绕它公转（长曝光式星轨）
  var pole = { x: 0.5, y: -0.30 };          // 相对坐标

  function buildTrails(){
    trails.length = 0;
    var areaScale = Math.min(1, (W * H) / (1600 * 900));
    var count = Math.round(clamp(CFG.trailMin + (CFG.trailMax - CFG.trailMin) * areaScale,
                                 CFG.trailMin, CFG.trailMax));

    var px = W * pole.x, py = H * pole.y;

    for (var i = 0; i < count; i++){
      // 直接在画面内取一个点，再反算极坐标 —— 保证星一定落在可见区域
      var sx = rand(W * 0.01, W * 0.99);
      var sy = rand(H * 0.02, H * 0.99);
      var dx = sx - px, dy = sy - py;
      var r = Math.sqrt(dx * dx + dy * dy);
      if (r < 40) continue;

      var bucket = Math.floor(Math.random() * BUCKETS.length);
      var arcMax = rand(CFG.arcLen[0], CFG.arcLen[1]);
      trails.push({
        r: r,
        a: Math.atan2(dy, dx),
        omega: rand(CFG.omega[0], CFG.omega[1]),
        arcMax: arcMax,
        grow: rand(0.15, 1.0),          // 开场时弧已经有一部分
        growT: rand(CFG.growT[0], CFG.growT[1]),
        b: bucket,
        headR: rand(0.5, 1.7),
        phase: rand(0, Math.PI * 2),
        tw: rand(0.5, 1.4)
      });
    }
    // 按亮度桶预分组，避免每帧重复筛选
    buckets = [[], [], [], []];
    for (var j = 0; j < trails.length; j++) buckets[trails[j].b].push(trails[j]);
  }
  var buckets = [[], [], [], []];

  function updateTrails(dt){
    for (var i = 0; i < trails.length; i++){
      var t = trails[i];
      t.a += t.omega * dt;
      if (t.grow < 1) t.grow = Math.min(1, t.grow + dt / t.growT);
    }
  }

  function drawTrails(tSec){
    var px = W * pole.x, py = H * pole.y;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.strokeStyle = '#d8ecff';

    for (var b = 0; b < buckets.length; b++){
      var list = buckets[b];
      if (!list.length) continue;

      for (var s = 0; s < SEGS.length; s++){
        var seg = SEGS[s];
        ctx.globalAlpha = BUCKETS[b] * seg.a;
        ctx.lineWidth = seg.w;
        ctx.beginPath();
        for (var i = 0; i < list.length; i++){
          var t = list[i];
          var span = t.arcMax * t.grow;
          if (span < 0.0008) continue;
          var a0 = t.a - span;
          var s0 = a0 + span * seg.f0;
          var s1 = a0 + span * seg.f1;
          if (s1 - s0 < 0.0004) continue;
          // 每个 arc 之前必须 moveTo 到弧起点，否则会从上一段终点连一条直线
          ctx.moveTo(px + t.r * Math.cos(s0), py + t.r * Math.sin(s0));
          ctx.arc(px, py, t.r, s0, s1);
        }
        ctx.stroke();
      }
    }

    // 星头：量化成 4 档 alpha 批量填充，带轻微闪烁
    for (var b2 = 0; b2 < buckets.length; b2++){
      var list2 = buckets[b2];
      if (!list2.length) continue;
      ctx.beginPath();
      var drawn = 0;
      for (var k = 0; k < list2.length; k++){
        var tk = list2[k];
        var flick = 0.62 + 0.38 * Math.sin(tSec * tk.tw + tk.phase);
        // 用 4 个量化档位逼近闪烁值
        var q = Math.round(clamp(flick, 0, 1) * 3) / 3;
        if (q <= 0) continue;
        var hx = px + tk.r * Math.cos(tk.a);
        var hy = py + tk.r * Math.sin(tk.a);
        ctx.moveTo(hx + tk.headR, hy);
        ctx.arc(hx, hy, tk.headR, 0, Math.PI * 2);
        drawn++;
      }
      if (drawn) {
        ctx.globalAlpha = BUCKETS[b2];
        ctx.fillStyle = '#e6f3ff';
        ctx.fill();
      }
    }
    ctx.restore();
  }

  /* ---- 流星：移植「流星雨效果.html」的 Meteor 模型 ---- */
  function Meteor(initial){
    this.reset(initial);
  }
  Meteor.prototype.reset = function(initial){
    this.angle = rand(CFG.meteorAngle[0], CFG.meteorAngle[1]) * Math.PI / 180;
    this.speed = rand(CFG.meteorSpeed[0], CFG.meteorSpeed[1]);
    this.length = rand(CFG.meteorLength[0], CFG.meteorLength[1]);
    this.width = rand(CFG.meteorWidth[0], CFG.meteorWidth[1]);
    this.hue = rand(CFG.meteorHue[0], CFG.meteorHue[1]);

    this.x = rand(-W * 0.1, W * 1.15);
    this.y = initial ? rand(-H * 0.2, H * 0.35) : rand(-H * 0.35, -20);

    this.life = rand(0.8, 1.6);
    this.maxLife = this.life;
    this.alpha = rand(0.55, 1);
    this.delay = initial ? rand(0, 1.4) : rand(0, 0.5);
  };
  Meteor.prototype.update = function(dt){
    if (this.delay > 0){ this.delay -= dt; return; }
    this.x += Math.cos(this.angle) * this.speed * dt;
    this.y += Math.sin(this.angle) * this.speed * dt;
    this.life -= dt;
    if (this.life <= 0 || this.x < -this.length * 2 || this.y > H + this.length * 2){
      this.reset(false);
    }
  };
  Meteor.prototype.draw = function(){
    if (this.delay > 0 || this.life <= 0) return;
    var lifeRatio = Math.max(0, this.life / this.maxLife);
    var alpha = this.alpha * Math.min(1, lifeRatio * 2.2);

    var tailX = this.x - Math.cos(this.angle) * this.length;
    var tailY = this.y - Math.sin(this.angle) * this.length;

    var grad = ctx.createLinearGradient(this.x, this.y, tailX, tailY);
    grad.addColorStop(0,    'hsla(' + this.hue + ', 100%, 96%, ' + alpha + ')');
    grad.addColorStop(0.18, 'hsla(' + this.hue + ', 100%, 82%, ' + (alpha * 0.9) + ')');
    grad.addColorStop(0.55, 'hsla(' + this.hue + ', 100%, 72%, ' + (alpha * 0.35) + ')');
    grad.addColorStop(1,    'hsla(' + this.hue + ', 100%, 70%, 0)');

    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = grad;
    ctx.lineWidth = this.width;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(this.x, this.y);
    ctx.lineTo(tailX, tailY);
    ctx.stroke();

    var glow = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.width * 7);
    glow.addColorStop(0,    'hsla(' + this.hue + ', 100%, 98%, ' + alpha + ')');
    glow.addColorStop(0.35, 'hsla(' + this.hue + ', 100%, 85%, ' + (alpha * 0.45) + ')');
    glow.addColorStop(1,    'hsla(' + this.hue + ', 100%, 80%, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.width * 7, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  };

  function spawnMeteor(){
    if (meteors.length >= CFG.meteorCount) return;
    meteors.push(new Meteor(false));
  }

  function resize(){
    W = window.innerWidth;
    H = window.innerHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildTrails();
    for (var i = 0; i < meteors.length; i++) meteors[i].reset(true);
  }

  function frame(now){
    if (!running) return;
    skyFrames++;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    var tSec = now / 1000;

    ctx.clearRect(0, 0, W, H);      // 每帧全清：不做低 alpha 覆盖，杜绝残影堆积
    updateTrails(dt);
    drawTrails(tSec);               // 先星轨

    spawnAcc += dt;
    if (spawnAcc >= CFG.spawnInterval){
      spawnAcc = 0;
      spawnMeteor();
    }
    for (var i = 0; i < meteors.length; i++){
      meteors[i].update(dt);
      meteors[i].draw();            // 后流星
    }

    raf = requestAnimationFrame(frame);
  }

  function startSky(){
    if (started) return;
    started = true;
    resize();
    meteors = [];
    for (var i = 0; i < CFG.meteorCount; i++) meteors.push(new Meteor(true));
    spawnAcc = 0;

    if (STILL){
      // 静态终态：手动积分 6 秒的星轨演化，再按「星轨 → 流星」顺序各画一遍
      for (var s = 0; s < 200; s++) updateTrails(0.03);
      ctx.clearRect(0, 0, W, H);
      drawTrails(6);
      for (var j = 0; j < meteors.length; j++){
        var m = meteors[j];
        m.delay = 0;
        m.x = rand(W * 0.10, W * 0.92);
        m.y = rand(H * 0.06, H * 0.78);
        m.life = m.maxLife;
        m.draw();
      }
      return;
    }
    last = performance.now();
    running = true;
    raf = requestAnimationFrame(frame);
  }

  var resizeTimer = 0;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      resize();
      if (STILL){ updateTrails(0); drawTrails(0); }
    }, 180);
  });

  document.addEventListener('visibilitychange', function(){
    if (document.hidden){
      running = false;
      cancelAnimationFrame(raf);
    } else if (!STILL && started){
      running = true;
      last = performance.now();
      raf = requestAnimationFrame(frame);
    }
  });

  /* =========================================================
     B. 文案：SVG 遮罩扫描 + 笔尖（移植 Sacramento 水平路径）
     ========================================================= */
  var NS = 'http://www.w3.org/2000/svg';
  var textLine = document.getElementById('textLine');
  var maskLine = document.getElementById('maskLine');
  var maskUse  = document.querySelector('.mask-path');
  var lineUse  = document.querySelector('.line');
  var copyText = document.getElementById('copyText');
  var pen      = document.getElementById('pen');
  var copyEl   = document.getElementById('copy');
  var hint     = document.getElementById('hint');

  var VB_W = 1200, VB_H = 420;
  var TARGET_W = 1000;          // 文字目标宽度（viewBox 单位）
  var TEXT_LEN = 0, MASK_LEN = 0;
  var DURATION = 4400;
  var textRaf = 0;
  var textTicks = 0;   // rAF 回调计数：用于区分「动画没启动」与「时钟没推进」

  function easeInOutCubic(t){
    return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
  }

  function layoutCopy(){
    // 1) 字号自适应：让文字宽度逼近 TARGET_W（不同系统手写体宽度差异很大）
    var fs = parseFloat(window.getComputedStyle(copyText).fontSize) || 96;
    var bb = copyText.getBBox();
    for (var i = 0; i < 4; i++){
      if (!bb.width) break;
      var ratio = TARGET_W / bb.width;
      if (Math.abs(ratio - 1) < 0.02) break;
      fs = clamp(fs * ratio, 18, 400);
      copyText.style.fontSize = fs + 'px';
      bb = copyText.getBBox();
    }
    if (!bb.width || !bb.height){
      // 字体完全不可用时的兜底：隐藏矢量字，显示纯文本
      copyText.style.opacity = '0';
      return false;
    }

    // 2) 居中：水平按字形框中心补偿（textPath + text-anchor 的字形框相对排版中点有偏差），
    //    垂直让字形视觉中心落在 viewBox 中心。两条路径同步平移。
    var cx = bb.x + bb.width / 2;
    var dx = clamp(VB_W / 2 - cx, -70, 70);
    var y = 300 + (VB_H / 2 - (bb.y + bb.height / 2));
    textLine.setAttribute('d', 'M ' + (90 + dx).toFixed(2) + ' ' + y.toFixed(2) +
                              ' L ' + (1110 + dx).toFixed(2) + ' ' + y.toFixed(2));
    bb = copyText.getBBox();

    // 3) 遮罩扫描线：覆盖整字高，宽度略超出字宽
    var my = bb.y + bb.height / 2;
    var pad = 20;
    var mx0 = bb.x - pad, mx1 = bb.x + bb.width + pad;
    maskLine.setAttribute('d', 'M ' + mx0.toFixed(2) + ' ' + my.toFixed(2) +
                              ' L ' + mx1.toFixed(2) + ' ' + my.toFixed(2));
    maskUse.style.strokeWidth = Math.max(40, bb.height * 2.8) + 'px';

    TEXT_LEN = textLine.getTotalLength();
    MASK_LEN = maskLine.getTotalLength();
    lineUse.style.strokeDasharray = TEXT_LEN + ' ' + TEXT_LEN;
    maskUse.style.strokeDasharray = MASK_LEN + ' ' + MASK_LEN;
    lineUse.style.strokeDashoffset = TEXT_LEN;
    maskUse.style.strokeDashoffset = MASK_LEN;

    copyEl.classList.add('ready');
    return true;
  }

  function renderCopy(progress){
    lineUse.style.strokeDashoffset = (TEXT_LEN * (1 - progress)).toFixed(2);
    maskUse.style.strokeDashoffset = (MASK_LEN * (1 - progress)).toFixed(2);
    var pt = textLine.getPointAtLength(TEXT_LEN * progress);
    pen.setAttribute('cx', pt.x.toFixed(2));
    pen.setAttribute('cy', pt.y.toFixed(2));
    pen.setAttribute('opacity', progress >= 0.995 ? '0' : '1');
  }

  function playCopy(){
    if (!layoutCopy()) return;
    if (STILL){
      renderCopy(1);
      pen.setAttribute('opacity', '0');
      hint.classList.add('on');
      return;
    }
    renderCopy(0);
    var startT = performance.now();
    function tick(now){
      textTicks++;
      var raw = Math.min(1, (now - startT) / DURATION);
      renderCopy(easeInOutCubic(raw));
      if (raw < 1){
        textRaf = requestAnimationFrame(tick);
      } else {
        setTimeout(function(){ hint.classList.add('on'); }, 520);
      }
    }
    textRaf = requestAnimationFrame(tick);
  }

  /* =========================================================
     C. 启动
     ========================================================= */
  function boot(){
    try { startSky(); } catch (e) { /* 画布失败不阻断文案 */ }

    var go = function(){
      try { playCopy(); } catch (e) {
        copyEl.classList.add('ready');
        hint.classList.add('on');
      }
    };
    if (document.fonts && document.fonts.ready && document.fonts.ready.then){
      document.fonts.ready.then(go, go);
    } else {
      go();
    }
  }

  // 全屏点击层：拦下普通点击做退场动画，modifier / 中键交给浏览器
  var enter = document.getElementById('enter');
  var stage = document.getElementById('stage');
  enter.addEventListener('click', function(e){
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey || e.button !== 0) return;
    e.preventDefault();
    stage.classList.add('leaving');
    setTimeout(function(){ window.location.href = 'home.html'; }, 200);
  });

  /* ---------- 自检：?selftest=1 输出真实测量值 ---------- */
  (function selftest(){
    if (!/[?&]selftest=1/.test(location.search)) return;
    setTimeout(function(){
      var bb = null;
      try { bb = copyText.getBBox(); } catch (e) {}
      var out = {
        dpr: DPR, wrapW: W, wrapH: H,
        canvasPx: [canvas.width, canvas.height],
        trails: trails.length,
        buckets: buckets.map(function(a){ return a.length; }),
        meteors: meteors.length,
        fontFamily: window.getComputedStyle(copyText).fontFamily.split(',')[0],
        fontSize: window.getComputedStyle(copyText).fontSize,
        textBBox: bb ? { x: +bb.x.toFixed(1), y: +bb.y.toFixed(1), w: +bb.width.toFixed(1), h: +bb.height.toFixed(1) } : null,
        textRect: (function(){   // 屏幕坐标：验证文案视觉中心是否真的落在视口中心
          try {
            var r = copyText.getBoundingClientRect();
            return { x: +r.x.toFixed(1), y: +r.y.toFixed(1), w: +r.width.toFixed(1), h: +r.height.toFixed(1),
                     cx: +(r.x + r.width / 2).toFixed(1), cy: +(r.y + r.height / 2).toFixed(1),
                     offX: +(r.x + r.width / 2 - W / 2).toFixed(1), offY: +(r.y + r.height / 2 - H / 2).toFixed(1) };
          } catch (e) { return null; }
        })(),
        targetW: TARGET_W,
        textLen: +TEXT_LEN.toFixed(1),
        maskLen: +MASK_LEN.toFixed(1),
        lineOffset: lineUse.style.strokeDashoffset,
        maskOffset: maskUse.style.strokeDashoffset,
        maskStrokeWidth: maskUse.style.strokeWidth,
        wordOpacity: window.getComputedStyle(document.getElementById('word')).opacity,
        copyReady: copyEl.classList.contains('ready'),
        hintOn: hint.classList.contains('on'),
        imgLoaded: (function(){
          var im = document.querySelector('.bg img');
          return im ? { complete: im.complete, nat: [im.naturalWidth, im.naturalHeight], cur: im.currentSrc.split('/').pop() } : null;
        })(),
        reduce: reduce,
        still: STILL,
        textTicks: textTicks,
        skyFrames: skyFrames
      };
      var d = document.createElement('pre');
      d.id = 'selftest';
      d.style.cssText = 'position:fixed;left:0;bottom:0;z-index:9;font:11px monospace;color:#8f8;background:#000a;padding:6px;max-width:100vw;white-space:pre-wrap';
      d.textContent = JSON.stringify(out, null, 2);
      document.body.appendChild(d);
    }, 2600);
  })();

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
</body>
