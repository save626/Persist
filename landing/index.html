<script>
/* ============================================================
   开场动画：eyeTutorial 复刻版的 ASCII 眼睛 → 穿过星场 → 落地页
   ------------------------------------------------------------
   渲染引擎是 third_party/eyetutorial-replica/engine.js（vendored，
   与源工程逐字节一致）：Python 原版 eye_ascii/ 的 JavaScript 移植，
   同一套数学（MT19937、程序化贴图、虹膜纤维、睫毛、星场）。

   ★ 关键：字符格必须用 Python 原版的物理尺寸，不能按视口放大
   ------------------------------------------------------------
   复刻版 web/index.html 默认把字符格放到 13×30px 并按视口铺满，
   结果是**同一只眼睛用更少、更大的字符去画** —— 虹膜纤维、睫毛、
   瞳孔边缘全糊成色块，正是「字符过于密集、展现不出原版效果」的根因。
   Python 原版是 8×17px 的字符格、30 行（画面仅 704×510），
   眼睛在**大量黑色留白**里被细密地画出来，结构才立得住。

   所以这里：
     · 字符格固定 8×17 CSS px（= 原版 Consolas size=8 的度量）
     · 行数按视口高度算，但封顶 44 行（保证窄屏也够细）
     · 画布**不铺满视口**，居中显示，四周留黑 —— 与原版构图一致

   时间线（相对原版压缩，引擎 CFG 在运行时改写）：
     0.00 皮肤与眉毛浮现，眼睑闭合
     0.90 眼睑睁开（2.4s，带回弹）
     4.00 眨眼一次
     5.40 镜头向瞳孔推进（指数缩放 1→14）
     6.90 星场出现，星星开始掠过
     9.90 瞳孔铺满画面 → 交棒落地页
   **不进心形星云**：把 CFG.T_HEART 推到极远，心形云雾永远不出现。
   ============================================================ */
(function(){
  'use strict';

  var overlay = document.getElementById('intro');
  var ready = window.__persistReady;
  if (!overlay || !ready) { if (ready) ready.fire(); return; }

  var canvas = document.getElementById('introCanvas');
  var skipBtn = document.getElementById('introSkip');
  var stage = document.getElementById('stage');
  var wrap = document.querySelector('.wrap');
  var engine = window.EyeEngine;

  // 引擎缺失（文件没随页面部署）→ 整层不出现，直接进落地页。
  if (!engine || !canvas || !canvas.getContext) {
    overlay.hidden = true;
    ready.fire();
    return;
  }

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var STILL = /[?&]still=1/.test(location.search);
  var force = /[?&]intro=1/.test(location.search);
  var forceOff = /[?&]intro=0/.test(location.search);

  var motionOff = false;
  try { motionOff = localStorage.getItem('persist.motion') === 'off'; } catch (e) {}
  var skipped = false;
  try { skipped = sessionStorage.getItem('persist.intro.skip') === '1'; } catch (e) {}

  /* ---------- 时间线 ----------
     引擎 CFG 是导出对象，运行时改写即可，不必动引擎源码。

     ★ 两条硬约束（都写死在引擎里，只能靠改时间线来满足）：
       1) 镜头推进：T_Z0 起、T_ZD 内完成，结束时瞳孔铺满（T_SPACE = T_Z0 + T_ZD）
       2) 云雾：nebAmt = ease((t - (T_Z0 + 3.5)) / 8.0)
          → 只要 **T_ZD < 3.5**，推进结束那一刻云雾还没开始生成；
            收尾段再压到 nebAmt 可忽略（< 0.008），画面就不会出现原版
            那团粉紫色的星云。
          注意：CFG.T_HEART = 1e6 只能保证「心形」不出现，
          云雾本体照样会生成 —— 真正的开关是上面这条时间线约束。

     取值：T_Z0 = 4.6（睁眼 + 眨眼之后开始推进）、T_ZD = 3.2、T_SPACE = 7.8。
     6.9s 瞳孔铺满 → 满屏 3D 粒子流星雨淡入（字符画淡出）；
     8.5s 停在粒子层等用户点击，点任意位置才交棒落地页。 */
  var CFG = engine.CFG;
  var T_Z0 = 4.6, T_ZD = 3.2, T_SPACE = T_Z0 + T_ZD;
  CFG.T_Z0 = T_Z0;
  CFG.T_ZD = T_ZD;
  CFG.T_SPACE = T_SPACE;
  CFG.T_HEART = 1e6;        // 心形星云：morph 恒为 0，不会捏出心形
  CFG.T_HEART_D = 1;
  // ZEND 14 → 20：原版 14 倍放大时瞳孔差一点没铺满（0.72 × 0.098 × 14 = 0.99 < 1.03），
  // 收尾还停在「虹膜纹理充满画面」。放大到 20 倍后瞳孔真正铺满，
  // 画面切到深蓝黑星空 —— 这一层再淡出到落地页（落地页本身也是星空底），
  // 两段衔接才自然。
  CFG.ZEND = 20;

  var T = {
    meteor: 6.9,   // 瞳孔铺满 → 满屏 3D 粒子流星雨淡入（字符画淡出）
    wait:   8.5    // 粒子层完全接管；停引擎，停在粒子层等用户点击进落地页
  };

  /* ---------- 网格：Python 原版的字符格 ----------
     这一组数字不是拍脑袋，是从原版 `preview.py` 导出的 `docs/preview.png`
     联���表里反解出来的（联系表每格 624×450，面板间距 gap=10、标签行 label_h=18）：
         字符格 8×15 px  →  网格 78 列 × 30 行  →  画面 624×450
     其中 78 = floor(30 × 15 × ASPECT(1.40) / 8 / 2) × 2，和引擎的网格公式对得上。

     ★ 为什么原版看着「疏朗」，而同样的引擎换个画法就「过于密集」？
       差别全在**呈现层**，不在引擎：
         · 原版用 Consolas **常规体** 14px（advance 7.7px ≈ 格宽 8px 的 96%），
           笔画纤细 → 横向挤满一格，但格与格之间仍有细缝；
         · 之前这版用了 **bold** + 格高×0.68 的字号 → 笔画粗一倍、字号偏小，
           细缝被糊掉，看上去就是「一片符号墙」。
       所以下面三件事必须严格对齐原版：格 8×15、字号 = 格宽×1.75、**不加粗**。

     行数也锁死 30：眼裂高 = HU+HL = 0.5 画面高，眼睛在 30 行时只占 15 个字符行；
     行数往上加（44 行 → 22 行），皮肤纹理铺得更密，眼睛反而被淹没。

     不同屏幕靠**等比缩放**适配，而不是靠加行数 —— 构图比例始终与原版一致。 */
  var CELL_W = 8, CELL_H = 15;
  var BASE_ROWS = 30;
  // Consolas 的 advance ≈ 0.55em → 字号 = 格宽 / 0.55 ≈ 格宽 × 1.75，
  // 横向刚好填满一格（与原版 preview.py 的 14px / 8px 一致）。
  var FONT_RATIO = 1.75;

  function layout(){
    // 视口可用区（留一点边距，别贴边）
    var availW = (window.innerWidth || 1200) * 0.96;
    var availH = (window.innerHeight || 800) * 0.92;
    var rows = BASE_ROWS;
    // 引擎的网格比例：列数 = rows * ch * ASPECT / cw（取偶数）
    var cols = Math.floor(rows * CELL_H * 1.40 / CELL_W / 2) * 2;
    // 底稿尺寸 = 列数 × 8、行数 × 15
    var baseW = cols * CELL_W, baseH = rows * CELL_H;
    // 等比缩放：原版是 1:1 的 8×15（624×450），这里按视口放大，
    // 上限 1.9 倍 —— 再大字符就显笨，与原版气质不符。
    var scale = Math.min(availW / baseW, availH / baseH);
    if (scale > 1.9) scale = 1.9;
    if (scale < 0.8) scale = 0.8;
    return {
      rows: rows,
      cols: cols,
      cw: CELL_W * scale,
      ch: CELL_H * scale
    };
  }

  /* ---------- 配色：灰蓝（与产品令牌同族） ----------
     引擎输出两张表：
       · `idx` —— 每格显示 RAMP 里的第几个字符（亮度档 0..69）
       · `q`   —— 每格的量化颜色（三通道各 0..QL-1）
     这里不再照搬原版的琥珀虹膜 + 棕褐皮肤 —— 用户要求灰蓝统一。
     做法：把 q 的亮度（Rec.601 权重，与原版字符亮度一致）映射到灰蓝色阶，
     明暗层次原样保留（虹膜亮、皮肤中、瞳孔暗），只是色相换成冷灰蓝。
     暗端 #1d2833 → 亮端 #dbeaf3，与产品 --ink:#202830 / --blue:#78aac8 同族。 */
  var QL = engine.QL;
  function palette(q0, q1, q2, out){
    var lum = (0.30 * q0 + 0.60 * q1 + 0.10 * q2) / (QL - 1);
    // 0.72 次幂提亮暗部（原版做法），再压一档让皮肤沉下去 —— 保住疏朗感
    var v = Math.pow(Math.max(0, Math.min(1, lum)), 0.72) * 0.80;
    out[0] = Math.min(255, Math.round(29 + v * 190));
    out[1] = Math.min(255, Math.round(40 + v * 190));
    out[2] = Math.min(255, Math.round(51 + v * 191));
  }

  /* =========================================================
     满屏 3D 粒子流星雨（交棒段专用，独立全屏 canvas）
     ------------------------------------------------------------
     瞳孔铺满（6.9s）后：字符画淡出、这层淡入，铺满整个视口。
     「3D」来自每个粒子的深度 d：远的小/慢/暗/尾短，近的大/快/亮/尾长；
     再加一层缓慢飘移的深空粒子做视差，强化空间纵深。
     所有轨迹从画外左上同一辐射点发出 —— 近平行 = 流星雨，随机 = 下雨。
     灰蓝色阶 #467692 → #78aac8 → #dbeaf3，与产品同族。
     ========================================================= */
  var mCanvas = document.getElementById('introMeteor');
  var mctx = mCanvas ? mCanvas.getContext('2d', { alpha: true }) : null;
  var mW = 0, mH = 0, mDPR = 1;
  var meteors = [], dust = [], mAcc = 0, mInterval = 60, mMax = 46;
  var mRaf = 0, mRunning = false, mLast = 0, mFrames = 0;
  var mGlow = null;
  var mRadiant = { x: 0, y: 0 };

  function mRand(a, b){ return a + Math.random() * (b - a); }

  function buildMeteorGlow(){
    var s = 64;
    var c = document.createElement('canvas');
    c.width = s; c.height = s;
    var g = c.getContext('2d');
    var rg = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
    rg.addColorStop(0,   'rgba(219,234,243,.60)');
    rg.addColorStop(.32, 'rgba(120,170,200,.24)');
    rg.addColorStop(1,   'rgba(70,118,146,0)');
    g.fillStyle = rg;
    g.fillRect(0, 0, s, s);
    mGlow = c;
  }

  function mResize(){
    mW = window.innerWidth; mH = window.innerHeight;
    mDPR = Math.min(Math.max(window.devicePixelRatio || 1, 1), 2);
    mCanvas.width = Math.floor(mW * mDPR);
    mCanvas.height = Math.floor(mH * mDPR);
    mCanvas.style.width = mW + 'px';
    mCanvas.style.height = mH + 'px';
    mctx.setTransform(mDPR, 0, 0, mDPR, 0, 0);
    mMax = mW < 760 ? 24 : 46;
    mInterval = 900 / mMax;
    mRadiant.x = mW * 0.14; mRadiant.y = -mH * 0.26;
    var want = Math.min(120, Math.round(mW * mH / 14000));
    dust.length = 0;
    for (var i = 0; i < want; i++){
      dust.push({ x: mRand(0, mW), y: mRand(0, mH), z: mRand(.25, 1), r: mRand(.4, 1.5) });
    }
  }

  function makeMeteor(){
    var d = Math.pow(Math.random(), .62);   // 0 远 → 1 近，近的更多
    var x = mRand(-.05, 1.06) * mW;
    var y = mRand(-.38, 1.02) * mH;
    var dx = x - mRadiant.x, dy = y - mRadiant.y;
    var l = Math.sqrt(dx*dx + dy*dy) || 1;
    var ux = dx/l, uy = dy/l;
    var speed = 280 + d * 900;
    var m = {
      x:x, y:y, vx:ux*speed, vy:uy*speed,
      d:d, len:70 + d*220, w:.9 + d*2.6, alpha:.42 + d*.52,
      trail:[], last:0
    };
    var steps = 12;
    for (var s = steps; s >= 0; s--){
      var t = s/steps;
      m.trail.push({ x:x - ux*m.len*t, y:y - uy*m.len*t });
    }
    return m;
  }

  function mDraw(){
    mctx.clearRect(0, 0, mW, mH);
    // 深空粒子：近的落得快 —— 视差底，给流星雨空间纵深
    for (var i = 0; i < dust.length; i++){
      var p = dust[i];
      p.y += p.z * 7;
      if (p.y > mH + 2){ p.y = -2; p.x = mRand(0, mW); }
      mctx.fillStyle = 'rgba(150,190,214,' + (.12 + p.z*.34).toFixed(3) + ')';
      mctx.beginPath(); mctx.arc(p.x, p.y, p.r * p.z, 0, Math.PI*2); mctx.fill();
    }
    // 流星
    for (var i = 0; i < meteors.length; i++){
      var m = meteors[i];
      var t = m.trail;
      if (t.length < 2) continue;
      var n = t.length, head = t[n-1];
      var i1 = Math.min(n-1, Math.max(1, Math.round(n*.5)));
      var segs = [
        {a:0, b:i1, w:m.w*.4, al:m.alpha*.34},
        {a:i1, b:n-1, w:m.w, al:m.alpha}
      ];
      mctx.lineCap = 'round'; mctx.lineJoin = 'round';
      for (var s = 0; s < segs.length; s++){
        var sg = segs[s];
        if (sg.b <= sg.a) continue;
        var p0 = t[sg.a], p1 = t[sg.b];
        var g = mctx.createLinearGradient(p0.x, p0.y, p1.x, p1.y);
        g.addColorStop(0, 'rgba(70,118,146,0)');
        g.addColorStop(1, 'rgba(108,158,189,' + sg.al.toFixed(3) + ')');
        mctx.strokeStyle = g; mctx.lineWidth = sg.w;
        mctx.beginPath(); mctx.moveTo(p0.x, p0.y);
        for (var k = sg.a + 1; k <= sg.b; k++) mctx.lineTo(t[k].x, t[k].y);
        mctx.stroke();
      }
      if (m.d > .3 && mGlow){
        var gs = 14 + m.d*26;
        mctx.globalAlpha = .5 * m.alpha;
        mctx.drawImage(mGlow, head.x - gs/2, head.y - gs/2, gs, gs);
        mctx.globalAlpha = 1;
      }
    }
  }

  function mFrame(now){
    if (!mRunning) return;
    var dt = Math.min(.05, (now - mLast)/1000);
    mLast = now; mFrames++;
    mAcc += dt * 1000;
    while (mAcc >= mInterval){
      mAcc -= mInterval;
      if (meteors.length < mMax) meteors.push(makeMeteor());
    }
    for (var i = meteors.length - 1; i >= 0; i--){
      var m = meteors[i];
      m.x += m.vx*dt; m.y += m.vy*dt;
      if (now - m.last >= 16){
        m.last = now;
        m.trail.push({x:m.x, y:m.y});
        var head = m.trail[m.trail.length-1];
        while (m.trail.length > 2){
          var p0 = m.trail[0];
          var dx = head.x-p0.x, dy = head.y-p0.y;
          if (Math.sqrt(dx*dx+dy*dy) > m.len) m.trail.shift(); else break;
        }
      }
      if (m.x > mW+70 || m.y > mH+70) meteors.splice(i, 1);
    }
    mDraw();
    mRaf = requestAnimationFrame(mFrame);
  }

  function startMeteors(){
    if (!mctx || mRunning) return;
    mResize(); buildMeteorGlow();
    meteors.length = 0; mAcc = 0; mFrames = 0;
    // 预填：一上场就是一整场流星雨，不是从 zero 长出来
    for (var i = 0; i < Math.round(mMax*.6); i++) meteors.push(makeMeteor());
    mLast = performance.now();
    mRunning = true;
    mRaf = requestAnimationFrame(mFrame);
  }
  function stopMeteors(){
    mRunning = false; cancelAnimationFrame(mRaf);
  }

  /* ---------- 播放器 ---------- */
  var ctx = canvas.getContext('2d', { alpha: false });
  var renderer = null, cols = 0, rows = 0, cssW = 0, cssH = 0;
  var cellW = CELL_W, cellH = CELL_H;   // 实际字符格尺寸（随视口等比缩放）
  var prevIdx = null, prevQ = null;
  var raf = 0, running = false, t0 = 0, lastT = 0, lastDraw = 0;
  var frames = 0;
  var meteorOn = false, waiting = false;
  var rgb = [0, 0, 0];
  // 颜色缓存：key = q0*QL² + q1*QL + q2（颜色只有 QL³ = 13824 种组合），
  // 用 Map 存，避免每帧重复算色。
  var hexCache = new Map();

  function build(){
    var L = layout();
    rows = L.rows;
    cellW = L.cw; cellH = L.ch;
    // ★ opts 与 Python 原版 `renderer.py` 逐项对齐：
    //   smooth  = 0  不做 3×3 亮度平滑（原版没有这一步）
    //   contrast= 0  不做自动色阶拉伸（原版没有这一步；拉了会把中间调压平、
    //                  把暗部推进宽字符区，正是「密成一片」的推手）
    //   levels  = 0  不做字阶量化，直接用 70 档 RAMP
    //   hash    = 0.07 原版的逐格哈希抖动（皮肤颗粒感就来自这里）
    renderer = new engine.Renderer(L.cw, L.ch, rows, {
      smooth: 0, contrast: 0, levels: 0, hash: 0.07
    });
    cols = renderer.geo.nCols;
    rows = renderer.geo.nRows;

    // 画布 = 网格 × 字符格，**不铺满视口**：四周留黑，与原版构图一致。
    cssW = cols * L.cw;
    cssH = rows * L.ch;
    var dpr = Math.min(Math.max(window.devicePixelRatio || 1, 1), 2);
    canvas.width = Math.max(1, Math.round(cssW * dpr));
    canvas.height = Math.max(1, Math.round(cssH * dpr));
    // 画布居中：绝对定位 + translate，避免被 flex 拉伸变形
    canvas.style.position = 'absolute';
    canvas.style.left = '50%';
    canvas.style.top = '50%';
    canvas.style.transform = 'translate(-50%, -50%)';
    canvas.style.width = cssW + 'px';
    canvas.style.height = cssH + 'px';

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    // 字号 = 格宽 × 1.75（Consolas advance ≈ 0.55em），横向刚好填满一格，
    // 与原版 preview.py 的 Consolas 14px / 格宽 8px 完全一致。
    // ★ 必须用**常规体**：加粗会让笔画粗一倍、把格与格之间的细缝糊掉，
    //   观感就从「原版疏朗」变成「一片符号墙」。
    ctx.font = Math.round(L.cw * FONT_RATIO) + 'px Consolas, "Cascadia Mono", "Courier New", monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    prevIdx = new Int16Array(cols * rows).fill(-1);
    prevQ = new Int16Array(cols * rows * 3).fill(-1);
    renderer.reset();
    clearCanvas();
  }

  function clearCanvas(){
    ctx.fillStyle = '#0d151d';
    ctx.fillRect(0, 0, cssW, cssH);
  }

  function colorOf(q0, q1, q2){
    var key = q0 * QL * QL + q1 * QL + q2;
    var s = hexCache.get(key);
    if (s === undefined) {
      palette(q0, q1, q2, rgb);
      s = 'rgb(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ')';
      hexCache.set(key, s);
    }
    return s;
  }

  /* 差量重绘：只画「字符变了」或「颜色明显变了」的格子。
     每帧全量重画 2000+ 格在高分屏上会掉帧。

     ★★ 关键：字符变了必须**先把该格擦成背景色**再画新字符。
        只画新字符的话，旧字形的残笔会留在画布上（`X` 换成 `,` 只盖住一小块），
        几帧之后画面上就糊着一层旧字符 —— 看起来就是「字符过于密集」，
        而且推进到瞳孔铺满时整屏金色残影永远擦不掉。 */
  function drawFrame(idx, q){
    var n = idx.length;
    for (var p = 0; p < n; p++){
      var po = p * 3;
      var i0 = idx[p];
      var charChanged = (i0 !== prevIdx[p]);
      if (!charChanged &&
          Math.abs(q[po] - prevQ[po]) < 3 &&
          Math.abs(q[po + 1] - prevQ[po + 1]) < 3 &&
          Math.abs(q[po + 2] - prevQ[po + 2]) < 3) continue;
      var c = p % cols, r = (p / cols) | 0;
      var x = c * cellW, y = r * cellH;
      if (charChanged){
        // 擦掉旧字形（多擦 1px，兜住字形边缘的抗锯齿溢出）
        ctx.fillStyle = '#0d151d';
        ctx.fillRect(x - 1, y - 1, cellW + 2, cellH + 2);
      }
      if (i0 !== 0){
        ctx.fillStyle = colorOf(q[po], q[po + 1], q[po + 2]);
        ctx.fillText(engine.RAMP[i0], x + cellW / 2, y + cellH / 2);
      }
      prevIdx[p] = i0;
      prevQ[po] = q[po]; prevQ[po + 1] = q[po + 1]; prevQ[po + 2] = q[po + 2];
    }
  }

  function frame(now){
    if (!running) return;
    var dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;
    var t = (now - t0) / 1000;
    // 引擎按 30fps 设计；高于 30fps 时跳帧，省一半绘制开销
    if (now - lastDraw < 1000 / 30 - 1) { raf = requestAnimationFrame(frame); return; }
    lastDraw = now;

    var f = renderer.render(t, dt);
    drawFrame(f.idx, f.q);
    frames++;

    if (!meteorOn && t >= T.meteor){
      meteorOn = true;
      overlay.classList.add('is-meteor');
      startMeteors();
    }
    if (t >= T.wait){
      // 停在满屏粒子层，不自动进落地页 —— 等用户点任意位置
      running = false;
      waiting = true;
      overlay.classList.add('is-waiting');
      return;   // 引擎 rAF 到此为止；粒子层自己继续跑
    }
    raf = requestAnimationFrame(frame);
  }

  /* ---------- 收尾 ---------- */
  var timers = [];
  function clearTimers(){ for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]); timers = []; }

  var done = false;
  function finish(){
    if (done) return;
    done = true;
    clearTimers();
    running = false;
    waiting = false;
    cancelAnimationFrame(raf);
    stopMeteors();
    overlay.classList.remove('is-on', 'is-meteor', 'is-waiting');
    overlay.classList.add('is-out');
    setTimeout(function(){ overlay.hidden = true; }, 520);
    if (stage) stage.inert = false;
    if (wrap) wrap.inert = false;
    document.documentElement.setAttribute('data-intro', 'off');
    ready.fire();
  }

  function skip(){
    try { sessionStorage.setItem('persist.intro.skip', '1'); } catch (e) {}
    finish();
  }

  /* ---------- 什么时候播 ---------- */
  var shouldPlay = !forceOff && !STILL && !reduce && !motionOff &&
                   (force || !skipped);

  if (!shouldPlay){
    overlay.hidden = true;
    ready.fire();
    return;
  }

  /* ---------- 开播 ---------- */
  overlay.hidden = false;
  overlay.classList.add('is-on');
  document.documentElement.setAttribute('data-intro', 'on');

  // 开场期间落地页不可聚焦（视觉上被盖住，键盘也不该能钻进去）
  if (stage) stage.inert = true;
  if (wrap) wrap.inert = true;

  if (skipBtn) skipBtn.addEventListener('click', skip);
  // 满屏粒子层停住后：点任意位置 / 按回车空格 才进落地页
  document.addEventListener('click', function(){ if (waiting && !done) finish(); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') skip();
    else if (waiting && !done && (e.key === 'Enter' || e.key === ' ')){
      e.preventDefault(); finish();
    }
  });

  build();
  t0 = performance.now();
  lastT = t0;
  lastDraw = 0;
  running = true;
  raf = requestAnimationFrame(frame);

  var resizeTimer = 0;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      if (mRunning) mResize();
      if (!running) return;
      var keep = renderer ? renderer.lastT : 0;
      build();
      // 重建后从当前时间继续，不重播
      t0 = performance.now() - keep * 1000;
      lastT = performance.now();
    }, 220);
  });

  /* ---------- 自检：?selftest=1 时暴露开场状态 ---------- */
  window.__persistIntroState = function(){
    return {
      playing: !done,
      done: done,
      hasOverlay: !!overlay,
      hasCanvas: !!canvas,
      hasSkip: !!skipBtn,
      cellW: Math.round(cellW),
      cellH: Math.round(cellH),
      cols: cols,
      rows: rows,
      frames: frames,
      heartDisabled: CFG.T_HEART > 1e5,
      tSpace: T_SPACE,
      meteorAt: T.meteor,
      waitAt: T.wait,
      meteorOn: meteorOn,
      waiting: waiting,
      meteorFrames: mFrames,
      meteorCount: meteors.length,
      meteorIsFullscreen: mCanvas ? (mCanvas.width >= window.innerWidth) : false,

    };
  };
})();
