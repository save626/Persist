/* ============================================================
   落地页（科技展示型）
   ------------------------------------------------------------
   定位：**炫技展示页**，不是产品介绍页。产品介绍在 home.html，
   这里只留项目名、一句 slogan、几个关键词，把版面让给视觉。

   视觉基调：与产品本体同一套色系（app/src/styles/home-v3.css 的令牌）——
   浅底 #F4F7F9、低饱和蓝灰、强调色 #467692 / #6D9FBD。
   背景渐变与 app 的 body 背景逐字对齐，落地页和���品是同一张纸。

   动效预算（1 主 + 2 点缀，刻意克制）：
     主特效 · Canvas 流星雨（平行轨迹 + 拖尾 + 头部高光）
     点缀 1 · 手写 SVG 标题「persist」逐笔浮现
     点缀 2 · 眼睛标记（借鉴 eyeTutrial 的「圆 + 眼睑 + 虹膜 + 高光」画法，
              虹膜跟随光标微动，入场眨一次眼）
   不做：Shader、视差堆叠、滚动依赖、频闪、自定义光标、仿真终端。

   所有元素零外部请求。
   ============================================================ */

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;color:var(--ink);
  font-family:var(--ui);
  background:var(--bg);
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

:root{
  /* —— 与产品本体的令牌保持一致 —— */
  --bg:#f4f7f9;
  --surface:#fbfcfd;
  --strong:#ffffff;
  --ink:#202830;
  --soft:#4d5965;
  --line:#dfe5eb;
  --line2:#cbd5de;
  --green:#6d9fbd;
  --deep:#467692;
  --gs:#e9f2f7;
  --blue:#78aac8;
  --bs:#eaf4f9;
  --indigo:#7f8fac;

  /* —— 两处为可读性做的加深（产品里的 --muted/--faint 在本底色上只有
        3.75 / ≈2.6，正文不可读）—— */
  --muted:#55616d;
  --faint:#616d79;

  --r:22px;
  --shadow:0 20px 55px rgba(42,56,70,.07);
  --ui:'Aptos','Noto Sans SC','PingFang SC','Microsoft YaHei',system-ui,'Segoe UI',sans-serif;
  --num:'Cascadia Mono','SFMono-Regular','Roboto Mono',ui-monospace,Menlo,Consolas,monospace;
}

/* ---------- 1. 舞台 ---------- */
.stage{
  position:fixed;inset:0;z-index:0;overflow:hidden;
  /* 与 app 的 body 背景完全一致 */
  background:
    radial-gradient(circle at 8% -8%, rgba(255,255,255,.9), transparent 34%),
    radial-gradient(circle at 105% 110%, rgba(126,173,200,.14), transparent 36%),
    var(--bg);
}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block}

/* 极细网格：给浅底一点结构，不抢戏 */
.grid{
  position:absolute;inset:0;pointer-events:none;opacity:.75;
  background-image:
    linear-gradient(to right, rgba(70,118,146,.055) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(70,118,146,.055) 1px, transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(110% 85% at 50% 46%, #000 0%, rgba(0,0,0,.35) 55%, transparent 84%);
  mask-image:radial-gradient(110% 85% at 50% 46%, #000 0%, rgba(0,0,0,.35) 55%, transparent 84%);
}
/* 中央柔光：把视线收进内容区，也让浅底上有一层「空气感」 */
.glow{
  position:absolute;left:50%;top:46%;width:min(92vw,1180px);aspect-ratio:2/1;
  transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(ellipse at center,
    rgba(255,255,255,.92) 0%, rgba(255,255,255,.5) 42%, rgba(255,255,255,0) 72%);
}
/* 边缘压暗（浅底上做成极淡的冷灰，收拢视线） */
.vignette{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(78% 66% at 50% 46%, rgba(203,213,222,0) 0%, rgba(203,213,222,.16) 78%, rgba(203,213,222,.3) 100%);
}

/* ---------- 2. 内容层 ---------- */
.wrap{position:relative;z-index:2;min-height:100dvh;display:flex;flex-direction:column}

.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:clamp(14px,2vw,22px) clamp(16px,3.4vw,40px);
}
.brand{
  display:inline-flex;align-items:center;gap:10px;
  font-family:var(--num);font-size:12px;letter-spacing:.3em;
  color:var(--ink);text-decoration:none;text-transform:uppercase;
}
/* 眼睛标记（点缀 2）：借鉴 eyeTutrial 的画法 —— 圆=虹膜、上下眼睑、
   最后加一点高光。虹膜跟随光标微动。 */
.eyemark{
  width:30px;height:18px;flex:0 0 auto;overflow:visible;
  transform-box:fill-box;transform-origin:50% 50%;
  animation:blink 5.6s ease-in-out infinite;
}
.eyemark .em-lid{fill:none;stroke:var(--deep);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* 虹膜/瞳孔是**有意义的图形**（WCAG 非文本对比度门槛 3:1）。
   早先用 --green 55% 透明度填充，实测只有 2.66:1 —— 改为实色。
   虹膜 #5c8ba9 对页面底 3.41:1，瞳孔 #16323f 对虹膜 3.66:1，两者都达标。 */
.eyemark .em-iris{fill:#5c8ba9}
.eyemark .em-pupil{fill:#16323f}
.eyemark .em-glint{fill:#fff}
.eyemark .em-eye{transition:none}
@keyframes blink{
  0%,92%,100%{transform:scaleY(1)}
  95%{transform:scaleY(.08)}
}
.top-actions{display:flex;align-items:center;gap:14px}
.toplink{
  font-size:12.5px;color:var(--muted);text-decoration:none;
  border-bottom:1px solid transparent;padding-bottom:2px;
  transition:color .2s ease,border-color .2s ease;
}
.toplink:hover{color:var(--deep);border-bottom-color:var(--line2)}
.toplink:focus-visible{outline:2px solid var(--deep);outline-offset:3px;border-radius:2px}

.stage-main{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:0 20px clamp(56px,8vh,84px);
}

/* ---------- 3. 手写标题（SVG 描边逐字浮现） ---------- */
.wordmark{
  display:block;width:clamp(230px,42vw,460px);height:auto;
  overflow:visible;margin:0 auto;
}
.wordmark .wm-path{
  fill:none;stroke:var(--deep);stroke-width:7.5;
  stroke-linecap:round;stroke-linejoin:round;
  /* 描边推进：由 dashoffset 归零控制，JS 逐笔推进。
     注意长度与偏移必须走 CSS 变量 —— 若用内联 style 写死，
     内联优先级高于 .is-drawn 类，归零动画就永远不会生效。 */
  stroke-dasharray:var(--len, none);
  stroke-dashoffset:var(--len, 0);
  transition:stroke-dashoffset 1.15s cubic-bezier(.55,.06,.28,1);
}
.wordmark .wm-path.is-drawn{stroke-dashoffset:0}
/* 无 JS 时路径必须可见（渐进增强） */
html.no-js .wordmark .wm-path{stroke-dasharray:none;stroke-dashoffset:0}

/* 标题下方的 slogan */
.slogan{
  margin:clamp(18px,3vh,30px) 0 0;
  font-size:clamp(15px,1.9vw,21px);line-height:1.6;color:var(--ink);
  letter-spacing:.02em;
}
.slogan em{font-style:normal;color:var(--deep)}
/* 关键词行 */
.keys{
  list-style:none;margin:clamp(14px,2.4vh,22px) 0 0;padding:0;
  display:flex;flex-wrap:wrap;gap:10px;justify-content:center;
}
.keys li{
  font-family:var(--num);font-size:11.5px;letter-spacing:.12em;
  color:var(--muted);padding:6px 13px;border-radius:999px;
  border:1px solid var(--line);background:rgba(255,255,255,.7);
}
.keys li b{color:var(--deep);font-weight:600}

/* ---------- 4. CTA ---------- */
.cta{
  margin-top:clamp(22px,3.4vh,32px);
  display:flex;gap:12px;flex-wrap:wrap;justify-content:center;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:46px;padding:0 26px;border-radius:12px;
  font-size:14.5px;font-weight:500;text-decoration:none;white-space:nowrap;
  transition:transform .18s ease,background-color .18s ease,border-color .2s ease,box-shadow .2s ease;
}
.btn:focus-visible{outline:2px solid var(--deep);outline-offset:3px}
.btn-primary{
  /* 渐变三档都必须对白字 ≥ 4.5:1 —— 上档不能比 #467692 更亮 */
  background:linear-gradient(180deg,#467692 0%,#42718c 55%,#3c6a84 100%);
  color:#fff;border:1px solid transparent;
  box-shadow:0 10px 24px rgba(70,118,146,.22);
}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 14px 30px rgba(70,118,146,.28)}
.btn-ghost{background:rgba(255,255,255,.72);color:var(--ink);border:1px solid var(--line2)}
.btn-ghost:hover{border-color:var(--green);transform:translateY(-1px)}
.note{margin:13px 0 0;font-size:12px;line-height:1.7;color:var(--faint)}

/* ---------- 5. 动效开关 ---------- */
.motion-toggle{
  display:inline-flex;align-items:center;gap:7px;
  font-family:var(--num);font-size:11px;letter-spacing:.08em;
  color:var(--muted);background:rgba(255,255,255,.7);cursor:pointer;
  border:1px solid var(--line);border-radius:999px;padding:6px 12px;
  transition:color .2s ease,border-color .2s ease;
}
.motion-toggle:hover{color:var(--deep);border-color:var(--line2)}
.motion-toggle:focus-visible{outline:2px solid var(--deep);outline-offset:3px}
.motion-dot{
  width:7px;height:7px;border-radius:50%;background:var(--green);
  box-shadow:0 0 0 3px rgba(109,159,189,.16);
  transition:background-color .2s ease,box-shadow .2s ease;
}
.motion-toggle[aria-pressed="false"] .motion-dot{background:var(--line2);box-shadow:none}
.motion-toggle[aria-pressed="false"]{color:var(--faint)}

/* ---------- 6. 备案信息页脚 ---------- */
.foot{
  position:fixed;left:0;right:0;bottom:0;z-index:4;
  padding:0 16px calc(10px + env(safe-area-inset-bottom,0px));
  text-align:center;font-size:11px;line-height:1.8;letter-spacing:.05em;
  color:var(--faint);pointer-events:none;
}
.foot a{
  color:var(--muted);pointer-events:auto;text-decoration:none;
  border-bottom:1px solid var(--line2);padding-bottom:1px;
  transition:color .2s ease,border-color .2s ease;
}
.foot a:hover{color:var(--deep);border-bottom-color:var(--green)}
.site-info-sep{margin:0 8px;color:var(--line2)}
.site-info-pending{color:var(--faint)}

/* ---------- 7. 响应式 ---------- */
@media (max-width:900px){
  .stage-main{padding-bottom:clamp(64px,12vh,96px)}
  .glow{width:min(130vw,1000px)}
}
@media (max-width:560px){
  .keys{gap:8px}
  .keys li{font-size:11px;padding:5px 11px}
  .wordmark{width:min(78vw,300px)}
  .note{font-size:11.5px}
  .brand{font-size:11px;letter-spacing:.24em}
  .eyemark{width:26px;height:16px}
  .btn{min-height:44px;padding:0 20px}
}

/* ---------- 8. 动效降级 ---------- */
@media (prefers-reduced-motion:reduce){
  .wordmark .wm-path{transition:none}
  .eyemark{animation:none}
  .btn,.toplink,.foot a,.motion-toggle{transition:none}
}

/* ============================================================
   9. 开场动画（eyeTutrial 眼型 + 星空穿行）
   ------------------------------------------------------------
   眼型来自 third_party/eyetutrial —— 上游 Praise-Peter/EyeTutrial-website
   的《How to draw eyes》教程，把它的画法整段搬成动画：
     Step 1 圆（眼球）→ 2 上眼睑 → 3 虹膜与瞳孔 → 4 下眼睑 → 5 双眼皮
     → 7 上色（眼白/虹膜）→ 8 阴影 → 9 虹膜碗状受光 → 13 高光与闪点
   上游是静态教程页、没有动画代码，本页把「描线→上色→高光」的顺序演一遍，
   随后接上睁眼 / 眨眼 / 视线游移 / 推进瞳孔 / 穿过星空。

   配色换成落地页的冷灰蓝色系（:root 令牌），不带上游的棕灰原色；
   星空段用同一族的深蓝（#16323f）而不是纯黑，收尾淡出时能接上浅色落地页。

   开眼/眨眼用 **mask**：眼裂形状整体缩放，虹膜被眼裂裁切，
   所以眨眼是「眼皮盖住虹膜」，不是把虹膜压扁。
   ============================================================ */
.intro{
  position:fixed;inset:0;z-index:60;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(125% 92% at 50% 44%, #1d3c4f 0%, #142a37 46%, #0b1a23 100%);
  opacity:0;transition:opacity .5s ease;
}
.intro[hidden]{display:none!important}
.intro.is-on{opacity:1}
.intro.is-out{opacity:0;pointer-events:none}
.intro-space{
  position:absolute;inset:0;width:100%;height:100%;display:block;
  opacity:0;transition:opacity .45s ease;
}
.intro-space.is-on{opacity:1}
.intro-eye{
  position:relative;z-index:2;
  width:min(88vw,760px);height:auto;display:block;overflow:visible;
  transition:opacity .5s ease;
}

/* ---------- 9.1 眼：分层画法（上游 14 步的顺序） ---------- */
.ie-halo{opacity:0;animation:ieFade 1.1s ease .15s forwards}
/* 睁眼前的那条闭眼线：先画出来，再被睁开的眼睛接管 */
.ie-closed{
  fill:none;stroke:#7aa3bd;stroke-width:3.4;stroke-linecap:round;
  stroke-dasharray:100;stroke-dashoffset:100;
  animation:ieDraw .42s ease var(--t-closed) forwards,
            ieFadeOut .38s ease var(--t-closedEnd) forwards;
}
/* Step 1 的圆：起稿辅助线，画完就收掉（留着会像一圈多余的轮廓） */
.ie-ball{
  fill:none;stroke:#5d89a5;stroke-width:2.1;
  stroke-dasharray:100;stroke-dashoffset:100;
  animation:ieDraw .5s ease var(--t-ball) forwards,
            ieBallFade .6s ease var(--t-ballFade) forwards;
}
.ie-shadow{opacity:0;animation:ieFade .55s ease var(--t-shadow) forwards}
/* 眼白在推进时被放大成上下两条白边，所以推进一开始就收掉 */
.ie-sclera{opacity:0;animation:ieFade .5s ease var(--t-sclera) forwards,ieFadeOut .3s ease var(--t-push) forwards}
.ie-iris,.ie-pupil,.ie-glint,.ie-glint2{
  opacity:0;transform-box:fill-box;transform-origin:50% 50%;
  animation:iePop .42s ease var(--t-iris) forwards;
}
.ie-pupil{animation:iePop .36s ease var(--t-pupil) forwards}
/* 高光在推进时被放大成巨白球，所以推进一开始就收掉 */
.ie-glint{animation:iePop .32s ease var(--t-glint) forwards,ieFadeOut .3s ease var(--t-push) forwards}
.ie-glint2{animation:iePop .32s ease var(--t-glint) forwards,ieFadeOut .3s ease var(--t-push) forwards}
.ie-iris-shade{opacity:0;animation:ieFade .45s ease var(--t-shade) forwards}
.ie-sparkle{
  opacity:0;transform-box:fill-box;transform-origin:50% 50%;
  animation:ieSpark .55s ease var(--t-sparkle) forwards,
            ieFadeOut .3s ease var(--t-push) forwards;
}
/* Step 2/4 眼睑、Step 5 双眼皮 */
.ie-lid{
  fill:none;stroke:#3f6d8a;stroke-width:3.2;
  stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:100;stroke-dashoffset:100;
  animation:ieDraw .34s ease var(--t-lid) forwards;
}
.ie-lid-up{--t-lid:var(--t-lidUp)}
.ie-lid-low{--t-lid:var(--t-lidLow)}
.ie-lid2{
  fill:none;stroke:#7fa5bd;stroke-width:1.5;stroke-linecap:round;opacity:.72;
  stroke-dasharray:100;stroke-dashoffset:100;
  animation:ieDraw .3s ease var(--t-lid2) forwards;
}
/* 眼裂（遮罩里的形状）负责睁眼与眨眼 */
.ie-openmask{
  transform-box:view-box;transform-origin:200px 132px;
  animation:ieOpen .5s ease var(--t-open) forwards,
            ieBlink .34s ease var(--t-blink1),
            ieBlink .34s ease var(--t-blink2);
}
.ie-blink{
  transform-box:view-box;transform-origin:200px 132px;
  animation:ieBlink .34s ease var(--t-blink1),
            ieBlink .34s ease var(--t-blink2);
}
/* 视线游移：只在虹膜组上平移，眼白和眼睑不动 */
.ie-gaze{animation:ieGaze 1.5s ease-in-out var(--t-gaze) both}
/* 镜头推进瞳孔：整只眼以瞳孔为原点放大。
   放大倍率由 JS 按视口算好写进 --push-scale（要保证瞳孔最后能填满屏幕），
   固定倍率在窄屏上会露边（眼白会从上下漏出来）。 */
.ie-push{
  transform-box:view-box;transform-origin:200px 130px;
  animation:iePush 1s cubic-bezier(.55,.02,.3,1) var(--t-push) forwards;
}

@keyframes ieDraw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
@keyframes ieFade{from{opacity:0}to{opacity:1}}
@keyframes ieFadeOut{from{opacity:1}to{opacity:0}}
@keyframes ieBallFade{to{opacity:0}}
@keyframes iePop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
@keyframes ieSpark{
  0%{opacity:0;transform:scale(.2) rotate(0deg)}
  55%{opacity:1;transform:scale(1.18) rotate(45deg)}
  100%{opacity:.92;transform:scale(1) rotate(45deg)}
}
@keyframes ieOpen{from{transform:scaleY(.05)}to{transform:scaleY(1)}}
@keyframes ieBlink{
  0%,100%{transform:scaleY(1)}
  46%,56%{transform:scaleY(.05)}
}
@keyframes ieGaze{
  0%{transform:translate(0,0)}
  15%{transform:translate(-15px,-5px)}
  33%{transform:translate(14px,3px)}
  51%{transform:translate(-5px,-13px)}
  69%{transform:translate(11px,9px)}
  85%{transform:translate(-9px,2px)}
  100%{transform:translate(0,0)}
}
@keyframes iePush{from{transform:scale(1)}to{transform:scale(var(--push-scale,20))}}

/* 跳过按钮：开场是暗场，按钮用浅色文字（与深底对比 ≥ 4.5:1） */
.intro-skip{
  position:absolute;right:clamp(16px,4vw,40px);bottom:clamp(16px,4vw,40px);z-index:3;
  display:inline-flex;align-items:center;gap:8px;
  font-family:var(--num);font-size:12px;letter-spacing:.12em;color:#d3e6f1;
  background:rgba(255,255,255,.07);border:1px solid rgba(160,200,225,.3);
  border-radius:999px;padding:10px 16px;cursor:pointer;
  transition:background-color .2s ease,border-color .2s ease,color .2s ease;
}

<script>
(function(){
  'use strict';

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var STILL = /[?&]still=1/.test(location.search) || reduce;

  /* =========================================================
     A. 流星雨（主特效）
     ------------------------------------------------------------
     为什么是「平行轨迹」而不是随机方向：
     真实流星雨是同一个辐射点发出的近平行轨迹。随机方向 = 下雨；
     共享主方向 + 小角度抖动 = 一场流星雨。

     分层画法（借鉴 eyeTutrial 的「线稿 → 柔光 → 上色 → 高光」）：
       1. 线稿：拖尾本体，两到三段渐细的描边
       2. 柔光：头部一圈更宽更淡的描边（bloom）
       3. 上色：拖尾从透明渐变到深蓝
       4. 高光：头部一个小亮点 + 预渲染的辉光贴图

     性能：辉光用**预渲染的离屏贴图**（createRadialGradient 每帧新建
     很贵）；拖尾按时间采样（14ms 一次），帧率变化时长度一致。
     ========================================================= */
  var canvas = document.getElementById('sky');
  var ctx = canvas.getContext('2d', { alpha: true });

  var W = 0, H = 0, DPR = 1;
  var raf = 0, last = 0, running = false, started = false, frames = 0;
  var meteors = [], meteorAcc = 0, meteorInterval = 520, maxMeteors = 16;
  var isMobile = false;
  var guardBox = null;            // 中央内容保护区（resize 时量一次）
  var glowSprite = null;          // 预渲染的辉光贴图
  var SPEED_SCALE = 1;            // 窄屏整体降速
  var TRAIL_DT = 14;              // 拖尾采样间隔 ms
  var radiant = { x: 0, y: 0 };   // 辐射点：所有流星从这里发出（画外左上方）

  function rand(a, b){ return a + Math.random() * (b - a); }
  function mulberry32(a){
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = Math.random;
  function srnd(a, b){ return a + rnd() * (b - a); }

  /* ---------- 辉光贴图（预渲染一次） ---------- */
  function buildGlow(){
    var s = 64;
    var c = document.createElement('canvas');
    c.width = s; c.height = s;
    var g = c.getContext('2d');
    var rg = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
    rg.addColorStop(0,   'rgba(120,170,200,.45)');
    rg.addColorStop(.35, 'rgba(120,170,200,.18)');
    rg.addColorStop(1,   'rgba(120,170,200,0)');
    g.fillStyle = rg;
    g.fillRect(0, 0, s, s);
    glowSprite = c;
  }

  /* ---------- 流星 ----------
     关键：**所有流星从同一个辐射点（画外左上方）发出**。
     这才是「流星雨」——同一个辐射源、轨迹呈放射状。
     平行下落的直线流看起来就是「下雨」，不是流星雨。 */
  function makeMeteor(){
    var depth = Math.pow(rnd(), 0.62);       // 0 远 → 1 近（偏置：近的更多）
    // 出生点直接落在画面内（留一点边距）。
    // 早先按「辐射点周围的环带」取点，结果一半流星生在画布外、
    // 一生成就出界被回收 → 屏幕上只剩 1~2 颗。
    var x = srnd(-0.08, 1.08) * W;
    var y = srnd(-0.42, 1.02) * H;
    // 方向：从辐射点指向出生点 —— 所有轨迹因此汇聚到同一个源
    var dx = x - radiant.x, dy = y - radiant.y;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    var ux = dx / len, uy = dy / len;
    var speed = (300 + depth * 780) * SPEED_SCALE;
    var m = {
      x: x, y: y,
      vx: ux * speed,
      vy: uy * speed,
      depth: depth,
      len: 80 + depth * 190,                 // 拖尾目标长度 px
      w: 1.3 + depth * 3.2,                  // 头部线宽
      alpha: 0.48 + depth * 0.44,
      trail: [],
      lastSample: 0,
      born: 0
    };
    // 预填拖尾：让流星一出现就带着完整尾迹。
    // 否则随机出生点普遍离边缘很近，0.7 秒就飞出屏幕 → 同屏只剩几颗，
    // 且每一颗都是「从一点长出来」，根本不像流星雨。
    var steps = 14;
    for (var s = steps; s >= 0; s--){
      var t = s / steps;
      m.trail.push({ x: x - ux * m.len * t, y: y - uy * m.len * t });
    }
    return m;
  }

  // 中央内容保护区：流星掠过标题时要软淡出，否则会划过文案。
  // 尺寸只在 resize 时量一次 —— 每帧 getBoundingClientRect 会强制重排。
  function measureGuard(){
    var el = document.querySelector('.stage-main');
    if (!el){ guardBox = null; return; }
    var b = el.getBoundingClientRect();
    guardBox = { x0: b.left - 14, y0: b.top - 12, x1: b.right + 14, y1: b.bottom + 12 };
  }

  function resize(){
    W = window.innerWidth;
    H = window.innerHeight;
    isMobile = W < 760;
    DPR = Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2);
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    // 流星数量：桌面要「密」——密集流星雨；窄屏砍到接近一半以内（低端机不卡死）
    maxMeteors = isMobile ? 20 : 44;
    // 生成速率由「稳态数量」反推：按 0.8 秒的期望在屏寿命折算间隔，
    // 让屏幕稳定铺满 maxMeteors 道流星（寿命比这短就说明间隔偏大）。
    meteorInterval = 800 / maxMeteors;
    // 窄屏修正：屏幕窄流星飞不远，整体降速，避免同屏只剩 1 颗。
    SPEED_SCALE = isMobile ? 0.62 : 1;
    // 辐射点：画外左上方。放在左上而不是正上方，是为了让轨迹斜穿画面，
    // 避免所有流星都朝同一个方向压过来。
    radiant.x = W * 0.14;
    radiant.y = -H * 0.26;
    measureGuard();
  }

  function update(dt, now){
    meteorAcc += dt * 1000;
    while (meteorAcc >= meteorInterval){
      meteorAcc -= meteorInterval;
      if (meteors.length < maxMeteors) meteors.push(makeMeteor());
    }

    var margin = 60;
    for (var i = meteors.length - 1; i >= 0; i--){
      var m = meteors[i];
      m.x += m.vx * dt;
      m.y += m.vy * dt;

      // 拖尾按时间采样，帧率变化时长度基本一致
      if (now - m.lastSample >= TRAIL_DT){
        m.lastSample = now;
        m.trail.push({ x: m.x, y: m.y });
        // 按距离裁剪：太老的点丢掉
        var head = m.trail[m.trail.length - 1];
        while (m.trail.length > 2){
          var d0 = m.trail[0];
          var dx = head.x - d0.x, dy = head.y - d0.y;
          if (Math.sqrt(dx*dx + dy*dy) > m.len) m.trail.shift();
          else break;
        }
      }

      // 出界即回收。流星只会向右下飞，所以只需要判右边界和下边界 ——
      // 早先还判了上/左边界（-120px），而生成区在 y ∈ [-0.40H, 0.02H]，
      // 出生在上方的流星一生成就被回收 → 屏幕上只剩 2~3 颗。
      if (m.x > W + margin || m.y > H + margin){
        meteors.splice(i, 1);
      }
    }
  }

  function guardFade(x, y){
    if (!guardBox) return 1;
    if (x < guardBox.x0 || x > guardBox.x1 || y < guardBox.y0 || y > guardBox.y1) return 1;
    var dx = Math.min(x - guardBox.x0, guardBox.x1 - x);
    var dy = Math.min(y - guardBox.y0, guardBox.y1 - y);
    var depth = Math.min(dx, dy);
    return Math.min(1, depth / 34);   // 边缘 34px 内线性淡出
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);

    for (var i = 0; i < meteors.length; i++){
      var m = meteors[i];
      var t = m.trail;
      if (t.length < 2) continue;

      var n = t.length;
      var head = t[n - 1];

      // 分段索引必须钳在 [1, n-1] 内 —— 拖尾刚成形时只有 2 个点，
      // 越界会取到 undefined，随后 draw() 抛异常把整个 rAF 循环打死
      // （症状：屏幕上只剩 1 颗流星、帧数停在几十）。
      var segs;
      var i1 = Math.min(n - 1, Math.max(1, Math.round(n * 0.48)));
      var i2 = Math.min(n - 1, Math.max(i1, Math.round(n * 0.80)));
      if (n < 4){
        segs = [{ a: 0, b: n - 1, w: m.w, al: m.alpha }];
      } else {
        // 三段：越靠头越粗越亮 —— 做出锥形
        segs = [
          { a: 0,  b: i1, w: m.w * 0.42, al: m.alpha * 0.42 },
          { a: i1, b: i2, w: m.w * 0.75, al: m.alpha * 0.78 },
          { a: i2, b: n - 1, w: m.w,  al: m.alpha }
        ];
      }

      var fade = guardFade(head.x, head.y);

      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      for (var s = 0; s < segs.length; s++){
        var sg = segs[s];
        if (sg.b <= sg.a) continue;
        var p0 = t[sg.a], p1 = t[sg.b];
        var g = ctx.createLinearGradient(p0.x, p0.y, p1.x, p1.y);
        g.addColorStop(0, 'rgba(70,118,146,0)');
        g.addColorStop(1, 'rgba(52,102,128,' + (sg.al * fade).toFixed(3) + ')');
        ctx.strokeStyle = g;
        ctx.lineWidth = sg.w;
        ctx.beginPath();
        ctx.moveTo(p0.x, p0.y);
        for (var k = sg.a + 1; k <= sg.b; k++) ctx.lineTo(t[k].x, t[k].y);
        ctx.stroke();
      }

      // 柔光（bloom）：头部一段更宽更淡的描边，让流星有空气感。
      // 宽度不能太大 —— 宽到 3.6 倍时头部会糊成一个「蓝色圆球」，
      // 看起来像彗星而不像流星。
      var bh = head, bt = t[Math.max(0, i2)];
      var bg = ctx.createLinearGradient(bt.x, bt.y, bh.x, bh.y);
      bg.addColorStop(0, 'rgba(120,170,200,0)');
      bg.addColorStop(1, 'rgba(120,170,200,' + (0.16 * fade).toFixed(3) + ')');
      ctx.strokeStyle = bg;
      ctx.lineWidth = m.w * 2.0;
      ctx.beginPath();
      ctx.moveTo(bt.x, bt.y);
      ctx.lineTo(bh.x, bh.y);
      ctx.stroke();

      // 高光：头部亮点 + 预渲染辉光
      if (m.depth > 0.38 && fade > 0.05){
        var gs = (12 + m.depth * 20) * fade;
        if (glowSprite){
          ctx.globalAlpha = 0.45 * fade;
          ctx.drawImage(glowSprite, bh.x - gs/2, bh.y - gs/2, gs, gs);
          ctx.globalAlpha = 1;
        }
        ctx.fillStyle = 'rgba(45,92,116,' + (0.82 * fade).toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(bh.x, bh.y, m.w * 0.78, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function frame(now){
    if (!running) return;
    frames++;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt, now);
    draw();
    updateEye();
    raf = requestAnimationFrame(frame);
  }

  function start(){
    if (started) return;
    started = true;
    resize();
    buildGlow();
    meteors = [];

    if (STILL){
      // 静态终帧：固定种子造一批流星，头部落在画布内，拖尾沿反方向
      // （朝向辐射点）铺开 —— 一帧就能看到完整的「流星雨」构图。
      rnd = mulberry32(20261120);
      for (var i = 0; i < maxMeteors; i++){
        var m = makeMeteor();
        m.x = srnd(0.05, 0.95) * W;
        m.y = srnd(0.05, 0.92) * H;
        var dx = m.x - radiant.x, dy = m.y - radiant.y;
        var l = Math.sqrt(dx * dx + dy * dy) || 1;
        var sp = Math.sqrt(m.vx * m.vx + m.vy * m.vy);
        m.vx = dx / l * sp; m.vy = dy / l * sp;
        var back = srnd(0.5, 1.1);
        var steps = 22;
        for (var s = steps; s >= 0; s--){
          var t = s / steps;
          m.trail.push({ x: m.x - m.vx * back * t / 60, y: m.y - m.vy * back * t / 60 });
        }
        meteors.push(m);
      }
      draw();
      return;
    }

    last = performance.now();
    running = true;
    raf = requestAnimationFrame(frame);
  }

  var resizeTimer = 0;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      resize();          // resize 内部会重量保护区
      if (STILL) draw();
    }, 180);
  });

  document.addEventListener('visibilitychange', function(){
    if (document.hidden){
      running = false;
      cancelAnimationFrame(raf);
    } else if (!STILL && started){
      running = true;
      last = performance.now();
      raf = requestAnimationFrame(frame);
    }
  });

  /* =========================================================
     B. 手写标题逐笔浮现（点缀 1）
     ------------------------------------------------------------
     给每条路径量出总长度设为 dasharray，dashoffset 从长度归零 ——
     描边就「写」出来了。按笔画顺序依次启动，视觉上就是笔在写字。
     ========================================================= */
  var wmPaths = Array.prototype.slice.call(document.querySelectorAll('.wm-path'));
  function pathLen(p){
    try { return p.getTotalLength(); } catch (e) { return 0; }
  }
  function drawTitle(){
    wmPaths.forEach(function(p){
      var len = pathLen(p);
      if (!len) { p.classList.add('is-drawn'); return; }
      // 只设 CSS 变量，不写内联 stroke-dashoffset —— 否则内联样式会盖过
      // .is-drawn 类的归零规则，标题永远停在「完全隐藏」。
      p.style.setProperty('--len', len.toFixed(1));
    });
    // 逐条推进；每条留 115ms 间隔，读起来像一笔一笔写
    wmPaths.forEach(function(p, i){
      setTimeout(function(){ p.classList.add('is-drawn'); }, reduce ? 0 : 260 + i * 115);
    });
  }

  /* =========================================================
     C. 眼睛标记：虹膜跟随光标（点缀 2）
     ------------------------------------------------------------
     幅度很小（最大 ±2.6px），只是让标记「活着」，不去抢文案。
     触摸设备无光标 → 静止。减动效 → 静止。
     ========================================================= */
  var emEye = document.getElementById('emEye');
  var emTarget = { x: 0, y: 0 };
  var emCur = { x: 0, y: 0 };

  window.addEventListener('mousemove', function(e){
    if (reduce || !emEye) return;
    var b = emEye.getBoundingClientRect();
    if (!b.width) return;
    var cx = b.left + b.width / 2, cy = b.top + b.height / 2;
    var nx = (e.clientX - cx) / Math.max(240, window.innerWidth * 0.32);
    var ny = (e.clientY - cy) / Math.max(240, window.innerHeight * 0.32);
    var d = Math.sqrt(nx*nx + ny*ny);
    if (d > 1){ nx /= d; ny /= d; }
    emTarget.x = nx * 2.6;
    emTarget.y = ny * 2.6;
  });

  function updateEye(){
    if (!emEye) return;
    emCur.x += (emTarget.x - emCur.x) * 0.12;
    emCur.y += (emTarget.y - emCur.y) * 0.12;
    emEye.setAttribute('transform', 'translate(' + emCur.x.toFixed(2) + ',' + emCur.y.toFixed(2) + ')');
  }

  /* =========================================================
     D. 动效开关
     ------------------------------------------------------------
     用户可以随时关掉动效：流星雨停在当前帧、手写标题直接显示终态。
     选择记在 localStorage。
     ========================================================= */
  var toggle = document.getElementById('motionToggle');
  var motionLabel = document.getElementById('motionLabel');
  var STORE_KEY = 'persist.motion';

  function applyMotion(on){
    if (toggle){
      toggle.setAttribute('aria-pressed', on ? 'true' : 'false');
      if (motionLabel) motionLabel.textContent = on ? '动效 开' : '动效 关';
    }
    if (on){
      if (!STILL && started){ running = true; last = performance.now(); raf = requestAnimationFrame(frame); }
    } else {
      running = false;
      cancelAnimationFrame(raf);
    }
    document.documentElement.setAttribute('data-motion', on ? 'on' : 'off');
  }

  function readStored(){
    try { return localStorage.getItem(STORE_KEY); } catch (e) { return null; }
  }
  function storeMotion(v){
    try { localStorage.setItem(STORE_KEY, v); } catch (e) { /* 隐私模式下忽略 */ }
  }

  /* =========================================================
     E. 启动
     ========================================================= */

  /* 「落地页可以显形」的时机：开场动画（intro）结束后才写字。
     没有开场动画时（减动效 / 用户跳过 / ?intro=0）由 intro 脚本立刻 fire。
     注意：**fire 可能早于 add**（intro 脚本在解析期就 fire，
     主脚本的 boot() 要等 DOMContentLoaded 才 add），
     所以 add 要认「已经 fire 过了」这种情况，否则标题永远不画。
     兜底 15 秒：即使 intro 脚本异常，标题也不会永远空着。 */
  window.__persistReady = {
    cbs: [],
    fired: false,
    add: function (fn) {
      if (this.fired) { try { fn(); } catch (e) {} return; }
      this.cbs.push(fn);
    },
    fire: function () {
      if (this.fired) return;
      this.fired = true;
      var cbs = this.cbs;
      this.cbs = [];
      for (var i = 0; i < cbs.length; i++) { try { cbs[i](); } catch (e) {} }
    }
  };
  setTimeout(function(){ window.__persistReady.fire(); }, 15000);

  function boot(){
    try { start(); } catch (e) { /* 画布失败不阻断文案 */ }
    try {
      window.__persistReady.add(function(){
        try { drawTitle(); } catch (e) {
          for (var i = 0; i < wmPaths.length; i++) wmPaths[i].classList.add('is-drawn');
        }
      });
    } catch (e) {
      for (var i = 0; i < wmPaths.length; i++) wmPaths[i].classList.add('is-drawn');
    }

    // 动效开关：默认开；系统减动效偏好或用户上次选择关 → 尊重之
    var stored = readStored();
    var wantOn = stored === null ? !reduce : stored === 'on';
    if (!wantOn){
      wmPaths.forEach(function(p){ p.classList.add('is-drawn'); });
      applyMotion(false);
    } else {
      applyMotion(true);
    }

    if (toggle){
      toggle.addEventListener('click', function(){
        var on = toggle.getAttribute('aria-pressed') !== 'true';
        applyMotion(on);
        storeMotion(on ? 'on' : 'off');
      });
    }
  }

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

  /* ---------- 自检：?selftest=1 输出真实测量值 ---------- */
  // 注意：状态必须能被**实时**读取。动效开关的验收要比较「关掉前后帧数
  // 是否还在涨」，一次性快照做不到这件事 —— 所以对外暴露一个实时取值函数，
  // 自检块只是它在某一时刻的打印。
  function liveState(){
    var wm = document.getElementById('wordmark');
    var wr = wm ? wm.getBoundingClientRect() : null;
    var cta = document.getElementById('cta');
    var cr = cta ? cta.getBoundingClientRect() : null;
    // 流星方向分布：用来验证「都从同一个辐射点发出」
    var angles = [];
    var maxDev = 0;
    for (var i = 0; i < meteors.length; i++){
      var m = meteors[i];
      if (m.trail.length < 2) continue;
      var h = m.trail[m.trail.length - 1];
      var dx = h.x - radiant.x, dy = h.y - radiant.y;
      var l = Math.sqrt(dx * dx + dy * dy) || 1;
      var vl = Math.sqrt(m.vx * m.vx + m.vy * m.vy) || 1;
      var dot = (dx / l) * (m.vx / vl) + (dy / l) * (m.vy / vl);
      var dev = Math.acos(Math.max(-1, Math.min(1, dot)));
      if (dev > maxDev) maxDev = dev;
      angles.push(+(Math.atan2(m.vy, m.vx)).toFixed(3));
    }
    return {
      dpr: DPR, wrapW: W, wrapH: H,
      meteors: meteors.length, maxMeteors: maxMeteors,
      frames: frames, isMobile: isMobile,
      angles: angles,
      radiant: { x: +radiant.x.toFixed(1), y: +radiant.y.toFixed(1) },
      radialDev: +maxDev.toFixed(3),
      trails: (function(){
        var n = 0;
        for (var i = 0; i < meteors.length; i++) n += meteors[i].trail.length;
        return n;
      })(),
      scrollWidth: document.documentElement.scrollWidth,
      clientWidth: document.documentElement.clientWidth,
      wmPaths: wmPaths.length,
      wmDrawn: wmPaths.filter(function(p){ return p.classList.contains('is-drawn'); }).length,
      wmRect: wr ? { top: +wr.top.toFixed(1), bottom: +wr.bottom.toFixed(1), w: +wr.width.toFixed(1) } : null,
      ctaRect: cr ? { top: +cr.top.toFixed(1), bottom: +cr.bottom.toFixed(1) } : null,
      wmInViewport: wr ? (wr.top >= 0 && wr.bottom <= window.innerHeight) : null,
      ctaInViewport: cr ? (cr.top >= 0 && cr.bottom <= window.innerHeight) : null,
      hasTerminal: !!document.querySelector('.term'),
      hasEyemark: !!document.getElementById('eyemark'),
      keys: document.querySelectorAll('.keys li').length,
      narrow: W <= 900,
      reduce: reduce, still: STILL,
      motion: document.documentElement.getAttribute('data-motion')
    };
  }
  window.__persistLandingState = liveState;

  (function selftest(){
    if (!/[?&]selftest=1/.test(location.search)) return;
    setTimeout(function(){
      var d = document.createElement('pre');
      d.id = 'selftest';
      d.style.cssText = 'position:fixed;left:0;bottom:0;z-index:9;font:11px monospace;color:#046;background:#fffc;padding:6px;max-width:100vw;white-space:pre-wrap';
      d.textContent = JSON.stringify(liveState(), null, 2);
      document.body.appendChild(d);
    }, 2600);
  })();

  // 眼睛跟随光标的插值放在主 rAF 里（与流星共用），不另开循环
})();
</script>

<script>
/* ============================================================
   开场动画：eyeTutrial 的眼睛 → 穿过星空 → 落地页
   ------------------------------------------------------------
   眼型的画法与顺序来自 third_party/eyetutrial（上游 Praise-Peter/
   EyeTutrial-website 的《How to draw eyes》教程）：圆 → 上眼睑 →
   虹膜瞳孔 → 下眼睑 → 双眼皮 → 上色 → 阴影 → 虹膜受光 → 高光闪点。
   上游是静态教程页、本身没有动画代码，这里是把它的画法演成动画，
   并把配色换成落地页的冷灰蓝色系。

   时序（秒，变量 T 是唯一事实源，CSS 里的 animation-delay 全从这里取）：
     0.05 闭眼线    0.40 眼球圆   0.42 睁眼      0.62 上眼睑
     0.72 虹膜      0.85 下眼睑   0.95 瞳孔      1.05 双眼皮
     1.25 眼白上色  1.35 阴影     1.60 虹膜受光  1.85 高光
     2.00 闪点      2.15/2.75 眨眼  3.05 视线游移
     4.55 推进瞳孔  4.60 星空穿行  5.45 眼睛淡出  6.35 星空收尾
     6.90 交棒落地页（此时才开始写手写标题）
   ============================================================ */
(function(){
  'use strict';

  var overlay = document.getElementById('intro');
  var ready = window.__persistReady;
  if (!overlay || !ready) { if (ready) ready.fire(); return; }

  var canvas = document.getElementById('introSpace');
  var skipBtn = document.getElementById('introSkip');
  var stage = document.getElementById('stage');
  var wrap = document.querySelector('.wrap');

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var STILL = /[?&]still=1/.test(location.search);
  var force = /[?&]intro=1/.test(location.search);
  var forceOff = /[?&]intro=0/.test(location.search);

  var motionOff = false;
  try { motionOff = localStorage.getItem('persist.motion') === 'off'; } catch (e) {}
  var skipped = false;
  try { skipped = sessionStorage.getItem('persist.intro.skip') === '1'; } catch (e) {}

  var T = {
    closed: 0.05, closedEnd: 0.42,
    ball: 0.40, ballFade: 1.35, open: 0.42,
    lidUp: 0.62, lidLow: 0.85, lid2: 1.05,
    iris: 0.72, pupil: 0.95,
    sclera: 1.25, shadow: 1.35, shade: 1.60,
    glint: 1.85, sparkle: 2.00,
    blink1: 2.15, blink2: 2.75,
    gaze: 3.05, push: 4.55,
    eyeOut: 5.45, space: 4.60, out: 6.45, settle: 6.85, end: 7.00
  };
  for (var k in T) overlay.style.setProperty('--t-' + k, T[k] + 's');

  /* ---------- 星空：一片星点穿身而过（不是星云形状） ----------
     星在以观察者为中心的锥体里，z 变小时投影向外扩散 → 拉出速度线。
     先冲到最快再指数减速，收尾时只剩一层安静的星场。 */
  var space = (function(){
    if (!canvas || !canvas.getContext) return { start: function(){}, stop: function(){} };
    var ctx = canvas.getContext('2d');
    var stars = [], W = 0, H = 0, raf = 0, running = false, t0 = 0, last = 0;
    var FAR = 64;

    function resize(){
      W = canvas.clientWidth || window.innerWidth;
      H = canvas.clientHeight || window.innerHeight;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = Math.max(1, Math.floor(W * dpr));
      canvas.height = Math.max(1, Math.floor(H * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    function spawn(){
      // z 偏向近处：近星更亮、拉出的速度线更长，均匀分布会显得空。
      // x/y 与 z 同比例 → 出生时正好铺满屏幕（投影偏移 = ±f），
      // 之后 z 变小、星向外扩散，形成「穿过去」的观感。
      var z = FAR * Math.pow(Math.random(), 1.45);
      return {
        x: (Math.random() * 2 - 1) * z,
        y: (Math.random() * 2 - 1) * z,
        z: z,
        b: Math.random()
      };
    }
    function reset(){
      stars = [];
      // 数量跟屏幕面积走（视觉密度才一致），再夹在合理区间里
      var n = Math.round(Math.sqrt(W * H) * 0.45);
      if (n < 220) n = 220;
      if (n > 480) n = 480;
      for (var i = 0; i < n; i++) stars.push(spawn());
    }
    function speedAt(el){
      if (el < 0.3) return 56 * (el / 0.3);               // 起步加速
      if (el < 1.4) return 56;                             // 全速穿行（眼睛淡出期间仍在冲）
      return 56 * Math.exp(-(el - 1.4) * 3.2) + 1.2;      // 之后指数减速到慢漂
    }
    function frame(now){
      if (!running) return;
      var dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      var el = (now - t0) / 1000;
      var sp = speedAt(el);
      var f = Math.max(W, H) / 2;
      ctx.clearRect(0, 0, W, H);
      ctx.lineCap = 'round';
      for (var i = 0; i < stars.length; i++){
        var s = stars[i];
        var zPrev = s.z;
        s.z -= sp * dt;
        if (s.z < 0.8){ s = stars[i] = spawn(); zPrev = s.z; }
        var k1 = f / s.z, k0 = f / zPrev;
        var x1 = W / 2 + s.x * k1, y1 = H / 2 + s.y * k1;
        var x0 = W / 2 + s.x * k0, y0 = H / 2 + s.y * k0;
        var a = 0.34 + 0.66 * Math.pow(1 - s.z / FAR, 1.4);
        ctx.strokeStyle = s.b > 0.82
          ? 'rgba(226,242,250,' + a.toFixed(3) + ')'
          : 'rgba(150,196,224,' + (a * 0.8).toFixed(3) + ')';
        ctx.lineWidth = 0.8 + s.b * 1.4;
        ctx.beginPath();
        ctx.moveTo(x0, y0);
        ctx.lineTo(x1, y1);
        ctx.stroke();
      }
      raf = requestAnimationFrame(frame);
    }
    return {
      start: function(){
        resize();
        reset();
        canvas.classList.add('is-on');
        t0 = performance.now();
        last = t0;
        running = true;
        raf = requestAnimationFrame(frame);
      },
      stop: function(){
        running = false;
        cancelAnimationFrame(raf);
      },
      resize: function(){ if (running){ resize(); reset(); } }
    };
  })();

  /* ---------- 收尾 ---------- */
  var timers = [];
  function at(sec, fn){ timers.push(setTimeout(fn, sec * 1000)); }
  function clearTimers(){ for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]); timers = []; }

  var done = false;
  function finish(){
    if (done) return;
    done = true;
    clearTimers();
    space.stop();
    overlay.classList.remove('is-on');
    overlay.classList.add('is-out');
    setTimeout(function(){ overlay.hidden = true; }, 520);
    if (stage) stage.inert = false;
    if (wrap) wrap.inert = false;
    document.documentElement.setAttribute('data-intro', 'off');
    ready.fire();
  }

  function skip(){
    try { sessionStorage.setItem('persist.intro.skip', '1'); } catch (e) {}
    finish();
  }

  /* ---------- 什么时候播 ---------- */
  var shouldPlay = !forceOff && !STILL && !reduce && !motionOff &&
                   (force || !skipped);

  if (!shouldPlay){
    overlay.hidden = true;
    ready.fire();
    return;
  }

  /* ---------- 开播 ---------- */
  overlay.hidden = false;
  overlay.classList.add('is-on');
  document.documentElement.setAttribute('data-intro', 'on');

  /* 推进倍率按视口算：瞳孔半径 17 个单位，最后要能填满屏幕。
     固定倍率在窄屏上会露边 —— 眼白会从上下漏出来变成两条白边。
     元素此刻已显示，才量得到真实渲染宽度。 */
  (function(){
    var eye = document.getElementById('introEye');
    var w = eye ? eye.getBoundingClientRect().width : 0;
    if (!w) return;
    var pxPerUnit = w / 400;                      // viewBox 宽 400 单位
    var need = Math.max(window.innerWidth, window.innerHeight) / 2;
    var scale = need / (17 * pxPerUnit);
    overlay.style.setProperty('--push-scale', Math.max(10, Math.min(46, scale)).toFixed(2));
  })();

  // 开场期间落地页不可聚焦（视觉上被盖住，键盘也不该能钻进去）
  if (stage) stage.inert = true;
  if (wrap) wrap.inert = true;

  if (skipBtn) skipBtn.addEventListener('click', skip);
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') skip();
  });
  window.addEventListener('resize', function(){ space.resize(); });

  at(T.space, function(){ space.start(); });
  at(T.eyeOut, function(){
    // 眼睛淡出 → 露出正在穿行的星场（CSS 里 .intro-eye 有 .5s 过渡，不是硬切）
    var eye = document.getElementById('introEye');
    if (eye) eye.style.opacity = '0';
  });
  at(T.out, function(){
    // 星场收尾 → 深蓝幕布淡出 → 浅色落地页接手
    space.stop();
    if (canvas) canvas.classList.remove('is-on');
    overlay.classList.remove('is-on');
    overlay.classList.add('is-out');
  });
  at(T.end, finish);

  /* ---------- 自检：?selftest=1 时暴露开场状态 ---------- */
  window.__persistIntroState = function(){
    return {
      playing: !done,
      done: done,
      hasOverlay: !!overlay,
      hasEye: !!document.getElementById('introEye'),
      hasSpace: !!canvas,
      hasSkip: !!skipBtn,
      introAttr: document.documentElement.getAttribute('data-intro')
    };
  };
})();
</script>
</body>
</html>
