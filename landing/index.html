<style>
/* ============================================================
   落地页（入口页）
   ------------------------------------------------------------
   定位：陌生人点开链接的第一屏。3 秒内看懂「这是什么、我能得到
   什么、我该点哪里」；氛围由 3D 粒子流星雨承担，不靠技术词，
   不靠炫技抢戏。

   视觉：深空蓝黑 + 低饱和青蓝。介绍首页是浅色阅读页，本页是
   深色沉浸门 —— 两页共享同一套强调色与组件形制。

   动效：
     · 3D 粒子流星雨（Canvas 2D，真透视投影，不是贴图也不是假 3D）
     · 首屏元素一次性错峰淡入（只动 opacity / transform）
   不做：视差、数字滚动、循环呼吸、鼠标跟随、闪烁、粒子爆炸。
   ============================================================ */

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:#05070C;color:#F2F7FC;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",
              "Microsoft YaHei",system-ui,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

:root{
  --bg:#05070C;
  --ink:#F2F7FC;      /* 主文字 */
  --ink-2:#C6D4E1;    /* 副标题 */
  --ink-3:#93A6B8;    /* 弱化文字 */
  --accent:#8AD0F5;   /* 强调（青蓝） */
  --line:rgba(150,190,225,.20);
}

/* ---------- 1. 舞台：底色 + 极细网格 + 极光 ---------- */
.stage{position:fixed;inset:0;z-index:0;overflow:hidden;background:
  radial-gradient(118% 88% at 50% 4%, #16273D 0%, #0B1220 40%, #05070C 76%);}
.grid{
  position:absolute;inset:0;pointer-events:none;
  background-image:
    linear-gradient(to right, rgba(140,190,230,.055) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(140,190,230,.055) 1px, transparent 1px);
  background-size:72px 72px;
  -webkit-mask-image:radial-gradient(120% 92% at 50% 38%, #000 0%, rgba(0,0,0,.28) 58%, transparent 84%);
  mask-image:radial-gradient(120% 92% at 50% 38%, #000 0%, rgba(0,0,0,.28) 58%, transparent 84%);
}
.aurora{
  position:absolute;inset:-10%;pointer-events:none;
  background:
    radial-gradient(34% 26% at 20% 22%, rgba(64,150,205,.20), transparent 70%),
    radial-gradient(40% 30% at 80% 72%, rgba(88,116,205,.14), transparent 72%);
}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block}

/* 文案背后的柔和压暗：粒子穿过时正文仍然读得清。
   压得太狠会把中景的流星一起吃掉，视觉上就只剩几条线 —— 这里只压到能读。 */
.vignette{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(58% 44% at 50% 47%,
    rgba(4,7,13,.56) 0%, rgba(4,7,13,.22) 58%, rgba(4,7,13,0) 82%);
}

/* ---------- 2. 内容层 ---------- */
.wrap{position:relative;z-index:2;min-height:100dvh;display:flex;flex-direction:column}

.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:clamp(16px,2.2vw,26px) clamp(18px,4vw,46px);
}
.brand{
  font-size:13px;letter-spacing:.3em;font-weight:600;color:var(--ink);text-decoration:none;
}
.toplink{
  font-size:13px;color:var(--ink-3);text-decoration:none;
  border-bottom:1px solid transparent;padding-bottom:2px;
  transition:color .2s ease,border-color .2s ease;
}
.toplink:hover{color:var(--ink);border-bottom-color:var(--line)}
.toplink:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}

.hero{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:clamp(20px,4vh,48px) 20px clamp(12px,2vh,24px);
}
.eyebrow{
  margin:0 0 clamp(12px,2vh,20px);
  font-size:clamp(11px,1.15vw,13px);letter-spacing:.28em;color:var(--accent);
}
h1{
  margin:0;font-weight:600;letter-spacing:-.02em;
  font-size:clamp(30px,5.4vw,58px);line-height:1.16;
  max-width:15ch;text-wrap:balance;
}
h1 .ln{display:block}
.sub{
  margin:clamp(14px,2.4vh,22px) 0 0;
  max-width:40ch;font-size:clamp(14px,1.5vw,17px);line-height:1.85;color:var(--ink-2);
}
.cta{
  margin-top:clamp(22px,3.4vh,34px);
  display:flex;gap:12px;flex-wrap:wrap;justify-content:center;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:48px;padding:0 26px;border-radius:12px;
  font-size:15px;font-weight:500;text-decoration:none;white-space:nowrap;
  transition:transform .18s ease,background-color .18s ease,border-color .2s ease;
}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn-primary{background:var(--accent);color:#04121C;border:1px solid transparent}
.btn-primary:hover{background:#A6DDF8;transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn-ghost:hover{border-color:rgba(165,205,238,.45);transform:translateY(-1px)}
.note{margin:14px 0 0;font-size:12.5px;line-height:1.7;color:var(--ink-3)}

/* ---------- 3. 底部三个短价值 ---------- */
.values{
  display:flex;gap:clamp(22px,5vw,72px);justify-content:center;flex-wrap:wrap;
  padding:clamp(18px,3.4vh,38px) 20px 52px;
}
.value{text-align:center;max-width:22ch}
.value b{display:block;font-size:14px;font-weight:600;letter-spacing:.04em}
.value span{display:block;margin-top:5px;font-size:12px;line-height:1.6;color:var(--ink-3)}

/* 窄屏：三个价值改成单列列表，避免 flex 换行出现「2 + 1 孤行」 */
@media (max-width:560px){
  .values{flex-direction:column;align-items:stretch;gap:0;padding:clamp(14px,2.4vh,24px) 26px 56px}
  .value{
    max-width:none;text-align:left;display:flex;align-items:baseline;gap:14px;
    padding:10px 0;border-top:0.5px solid var(--line);
  }
  .value:first-child{border-top:none;padding-top:0}
  .value b{flex:0 0 auto}
  .value span{margin-top:0;text-align:left}
}

/* ---------- 4. 备案信息页脚 ---------- */
/* 独立于 .stage（fixed）：无 JS 降级态下备案信息依然可见。
   容器不吃点击，只有备案号链接可点。 */
.foot{
  position:fixed;left:0;right:0;bottom:0;z-index:5;
  padding:0 16px calc(10px + env(safe-area-inset-bottom,0px));
  text-align:center;font-size:11px;line-height:1.8;letter-spacing:.05em;
  /* 11px 是小字，对比度门槛 4.5 —— 用实色而不是半透明，否则实际只有 3.6:1 */
  color:#A3B6C6;pointer-events:none;
}
.foot a{
  color:#C2D2DF;pointer-events:auto;text-decoration:none;
  border-bottom:1px solid rgba(194,210,223,.36);padding-bottom:1px;
  transition:color .2s ease,border-color .2s ease;
}
.foot a:hover{color:#E4EFF8;border-bottom-color:rgba(228,239,248,.66)}
.site-info-sep{margin:0 8px;color:rgba(163,182,198,.5)}
.site-info-pending{color:#A3B6C6}

/* ---------- 5. 入场动画（渐进增强）---------- */
/* 只有 html.js 下才隐藏；脚本没跑起来或 JS 被禁用时内容完整可读。 */
html.js .stagger{opacity:0;transform:translateY(14px)}
html.js .stagger.is-in{
  opacity:1;transform:none;
  transition:opacity .72s cubic-bezier(.22,.7,.28,1),transform .72s cubic-bezier(.22,.7,.28,1);
}

@media (prefers-reduced-motion:reduce){
  html.js .stagger{opacity:1;transform:none;transition:none}
  .btn,.toplink,.foot a{transition:none}
}
</style>
</head>
<body>

<div class="stage" id="stage" aria-hidden="true">
  <div class="aurora"></div>

</div>

<div class="wrap">
  <header class="topbar">

<script>
(function(){
  'use strict';

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // 静态完成态：供自检与截图使用（无头环境下 rAF 不推进也能看到终态）
  var STILL = /[?&]still=1/.test(location.search) || reduce;

  /* =========================================================
     A. 3D 粒子流星雨
     ------------------------------------------------------------
     坐标系：相机在原点沿 -z 看；流星在 (x,y,z) 里以恒定世界速度飞行，
     z 由远（≈1700）向近（≈260）推进。投影是标准针孔投影：
         k = FOCAL / z,  screen = center + world * k
     透视感全部来自这行投影 —— 近处的流星更粗、拖尾更长，远处的更细更短。
     不用 WebGL：零外部依赖是硬约束；且 Canvas 2D 的粒子数量与帧预算
     完全可控，移动端更稳。
     ========================================================= */
  var canvas = document.getElementById('sky');
  var ctx = canvas.getContext('2d');

  var W = 0, H = 0, DPR = 1, CX = 0, CY = 0;
  var FOCAL = 820, Z_FAR = 1700, Z_NEAR = 260;
  var TRAIL_MAX = 16, TRAIL_DT = 26;      // 拖尾采样：每 26ms 记一个点，最多 16 个
  var meteors = [], raf = 0, last = 0, running = false, started = false;
  var frames = 0, spawnAcc = 0, peak = 0;
  var maxMeteors = 70, spawnInterval = 26, isMobile = false;
  var dirX = -0.62, dirY = 0.72, dirZ = -0.45;   // 下偏左（约 40°），同时朝相机推进

  var ALPHA_LEVELS = [0.13, 0.36, 0.72];
  var WIDTH_LEVELS = [0.8, 1.6, 3.0];
  var STREAK = 'rgba(163,214,255,1)';

  function rand(a, b){ return a + Math.random() * (b - a); }
  function clamp(v, a, b){ return v < a ? a : (v > b ? b : v); }

  // 固定种子的随机源：静态构图要可复现
  function mulberry32(a){
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = Math.random;
  function srnd(a, b){ return a + rnd() * (b - a); }

  function makeMeteor(){
    // 在远平面按屏幕比例撒点：绝大多数从视口上方偏外进入
    var z = Z_FAR * srnd(0.92, 1.06);
    var sx = srnd(-0.25, 1.25);
    var sy = srnd(-1.45, 0.15);
    var speed = srnd(520, 780);
    // 方向带抖动：整场同角度会看成「下雨」，随机偏一点才是「流星雨」
    var jx = dirX + srnd(-0.20, 0.20);
    var jy = dirY + srnd(-0.12, 0.12);
    var jz = dirZ + srnd(-0.08, 0.08);
    var len = Math.sqrt(jx * jx + jy * jy + jz * jz) || 1;
    jx = (jx / len) * speed; jy = (jy / len) * speed; jz = (jz / len) * speed;
    return {
      x: (sx * W - CX) * z / FOCAL,
      y: (sy * H - CY) * z / FOCAL,
      z: z,
      vx: jx, vy: jy, vz: jz,
      t: srnd(0.85, 1.35),      // 世界粗细系数（近处更粗）
      trail: [],
      lastSample: 0
    };
  }

  function resize(){
    W = window.innerWidth;
    H = window.innerHeight;
    isMobile = W < 700;
    DPR = Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2);
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = W / 2; CY = H / 2;
    // 粒子数量随面积自适应；窄屏再砍一档，避免移动端掉帧
    var area = Math.min(1, (W * H) / (1440 * 900));
    maxMeteors = Math.round((isMobile ? 32 : 52) + area * (isMobile ? 24 : 52));
    spawnInterval = Math.max(18, Math.round(2600 / maxMeteors));
  }

  function project(m){
    var k = FOCAL / m.z;
    return { x: CX + m.x * k, y: CY + m.y * k, k: k };
  }

  function update(dt, now){
    spawnAcc += dt;
    while (spawnAcc >= spawnInterval / 1000){
      spawnAcc -= spawnInterval / 1000;
      if (meteors.length < maxMeteors) meteors.push(makeMeteor());
    }
    for (var i = meteors.length - 1; i >= 0; i--){
      var m = meteors[i];
      m.x += m.vx * dt; m.y += m.vy * dt; m.z += m.vz * dt;
      if (now - m.lastSample >= TRAIL_DT){
        m.lastSample = now;
        var p = project(m);
        m.trail.push(p.x, p.y, p.k);
        if (m.trail.length > TRAIL_MAX * 3) m.trail.splice(0, m.trail.length - TRAIL_MAX * 3);
      }
      var sy = CY + m.y * (FOCAL / m.z);
      if (m.z < Z_NEAR || sy > H + 260 || m.x < -W * 2.4 || m.x > W * 2.4){
        meteors.splice(i, 1);
      }
    }
    if (meteors.length > peak) peak = meteors.length;
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';

    // 分档批量描边：把 (透明度档 × 粗细档) 的线段合并成 9 次 stroke，
    // 避免每颗流星各描一次带来的调用爆炸。
    var buckets = [];
    for (var b = 0; b < 9; b++) buckets.push([]);
    var heads = [];

    for (var i = 0; i < meteors.length; i++){
      var m = meteors[i];
      var tr = m.trail;
      if (tr.length < 6) continue;
      var n = tr.length / 3;
      var fog = clamp((Z_FAR - m.z) / (Z_FAR - Z_NEAR), 0, 1);
      fog = Math.pow(fog, 1.25);

      for (var j = 1; j < n; j++){
        var ax = tr[(j - 1) * 3], ay = tr[(j - 1) * 3 + 1], ak = tr[(j - 1) * 3 + 2];
        var bx = tr[j * 3], by = tr[j * 3 + 1], bk = tr[j * 3 + 2];
        var t = j / (n - 1);
        var a = Math.pow(t, 1.7) * fog * 0.92;
        if (a <= 0.012) continue;
        // 屏幕粗细 = 透视系数 k × 世界粗细：远处细、近处粗，这才是纵深
        var wpx = clamp(bk * 2.0 * m.t, 0.5, 4.2);
        var al = a > 0.42 ? 2 : (a > 0.2 ? 1 : 0);
        var wl = wpx > 2.6 ? 2 : (wpx > 1.3 ? 1 : 0);
        buckets[al * 3 + wl].push(ax, ay, bx, by);
      }

      var hp = tr[tr.length - 3], hpy = tr[tr.length - 2], hk = tr[tr.length - 1];
      if (hk > 1.5) heads.push(hp, hpy, hk * 30, fog);
    }

    for (var bk2 = 0; bk2 < 9; bk2++){
      var seg = buckets[bk2];
      if (!seg.length) continue;
      var al2 = Math.floor(bk2 / 3), wl2 = bk2 % 3;
      ctx.globalAlpha = ALPHA_LEVELS[al2];
      ctx.strokeStyle = STREAK;
      ctx.lineWidth = WIDTH_LEVELS[wl2];
      ctx.beginPath();
      for (var s = 0; s < seg.length; s += 4){
        ctx.moveTo(seg[s], seg[s + 1]);
        ctx.lineTo(seg[s + 2], seg[s + 3]);
      }
      ctx.stroke();
    }

    // 近处流星的头部辉光：只有最靠近相机的那几颗，数量很少
    for (var q = 0; q < heads.length; q += 4){
      var gx = heads[q], gy = heads[q + 1], gr = heads[q + 2], gf = heads[q + 3];
      var g = ctx.createRadialGradient(gx, gy, 0, gx, gy, gr);
      g.addColorStop(0, 'rgba(226,244,255,' + (0.42 * gf).toFixed(3) + ')');
      g.addColorStop(0.4, 'rgba(150,206,255,' + (0.16 * gf).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(120,180,255,0)');
      ctx.globalAlpha = 1;
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(gx, gy, gr, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
  }

  function frame(now){
    if (!running) return;
    frames++;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt, now);
    draw();
    raf = requestAnimationFrame(frame);
  }

  function start(){
    if (started) return;
    started = true;
    resize();
    meteors = [];

    if (STILL){
      // 静态终态：固定种子造一批流星，跑一段固定时间后停帧
      rnd = mulberry32(20261119);
      var count = Math.round(maxMeteors * 0.8);
      for (var i = 0; i < count; i++){
        var m = makeMeteor();
        m.lastSample = 0;
        meteors.push(m);
      }
      for (var s = 0; s < 130; s++) update(1 / 60, s * 22);
      draw();
      return;
    }

    last = performance.now();
    running = true;
    raf = requestAnimationFrame(frame);
  }

  var resizeTimer = 0;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      resize();
      if (STILL) draw();
    }, 180);
  });

  document.addEventListener('visibilitychange', function(){
    if (document.hidden){
      running = false;
      cancelAnimationFrame(raf);
    } else if (!STILL && started){
      running = true;
      last = performance.now();
      raf = requestAnimationFrame(frame);
    }
  });

  /* =========================================================
     B. 入场：一次性错峰淡入
     ========================================================= */
  var stagger = Array.prototype.slice.call(document.querySelectorAll('.stagger'));
  function revealAll(){
    for (var i = 0; i < stagger.length; i++){
      (function(el, idx){
        setTimeout(function(){ el.classList.add('is-in'); }, reduce ? 0 : idx * 85);
      })(stagger[i], i);
    }
  }

  /* =========================================================
     C. 启动
     ========================================================= */
  function boot(){
    try { start(); } catch (e) { /* 画布失败不阻断文案 */ }
    try { revealAll(); } catch (e) {
      for (var i = 0; i < stagger.length; i++) stagger[i].classList.add('is-in');
    }
    // 兜底：即使上面的脚本抛错，2 秒后也必须把内容显示出来
    setTimeout(function(){
      for (var i = 0; i < stagger.length; i++) stagger[i].classList.add('is-in');
    }, 2000);
  }

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

  /* ---------- 自检：?selftest=1 输出真实测量值 ---------- */
  (function selftest(){
    if (!/[?&]selftest=1/.test(location.search)) return;
    setTimeout(function(){
      var h1 = document.querySelector('h1');
      var cta = document.querySelector('.cta');
      var hr = h1 ? h1.getBoundingClientRect() : null;
      var cr = cta ? cta.getBoundingClientRect() : null;
      var first = document.querySelector('.stagger');
      var out = {
        dpr: DPR, wrapW: W, wrapH: H,
        canvasPx: [canvas.width, canvas.height],
        meteors: meteors.length, peak: peak, frames: frames,
        maxMeteors: maxMeteors, spawnInterval: spawnInterval, isMobile: isMobile,
        scrollWidth: document.documentElement.scrollWidth,
        clientWidth: document.documentElement.clientWidth,
        scrollHeight: document.documentElement.scrollHeight,
        clientHeight: document.documentElement.clientHeight,
        h1Rect: hr ? { top: +hr.top.toFixed(1), bottom: +hr.bottom.toFixed(1) } : null,
        ctaRect: cr ? { top: +cr.top.toFixed(1), bottom: +cr.bottom.toFixed(1) } : null,
        h1InViewport: hr ? (hr.top >= 0 && hr.bottom <= window.innerHeight) : null,
        ctaInViewport: cr ? (cr.top >= 0 && cr.bottom <= window.innerHeight) : null,
        staggerIn: Array.prototype.slice.call(document.querySelectorAll('.stagger'))
          .every(function(el){ return el.classList.contains('is-in'); }),
        staggerOpacity: first ? getComputedStyle(first).opacity : null,
        values: document.querySelectorAll('.value').length,
        lastValueBottom: (function(){
          var vs = document.querySelectorAll('.value');
          if (!vs.length) return null;
          return +vs[vs.length - 1].getBoundingClientRect().bottom.toFixed(1);
        })(),
        footTop: (function(){
          var f = document.querySelector('.foot');
          return f ? +f.getBoundingClientRect().top.toFixed(1) : null;
        })(),
        reduce: reduce, still: STILL
      };
      var d = document.createElement('pre');
      d.id = 'selftest';
      d.style.cssText = 'position:fixed;left:0;bottom:0;z-index:9;font:11px monospace;color:#8f8;background:#000a;padding:6px;max-width:100vw;white-space:pre-wrap';
      d.textContent = JSON.stringify(out, null, 2);
      document.body.appendChild(d);
    }, 2600);
  })();
})();
</script>
</body>
</html>
