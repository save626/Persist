<style>
/* ============================================================
   落地页（科技展示型）
   ------------------------------------------------------------
   定位：**炫技展示页**，不是产品介绍页。产品介绍在 home.html，
   这里只留项目名、一句 slogan、几个关键词，把版面让给视觉。

   动效预算（刻意克制，详见 landing/README.md）：
     主特效 1 个 —— Canvas ASCII 字符流（中心瞳孔向外放射 / 消散）
     点缀 2 个 —— SVG 手写描边标题「Persist」+ 仿真终端窗口
   不做：Shader、视差堆叠、滚动依赖、频闪、鼠标跟随光标。

   视觉：近黑底 + 极低饱和青蓝。所有元素零外部请求。
   ============================================================ */

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:#04060A;color:#EAF4FF;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",
              "Microsoft YaHei",system-ui,"Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
}

:root{
  --bg:#04060A;
  --ink:#EAF4FF;      /* 主文字 */
  --ink-2:#9FB3C8;    /* 次级 */
  --ink-3:#6E8299;    /* 弱化 */
  --accent:#7FD8FF;   /* 强调（青） */
  --accent-dim:rgba(127,216,255,.16);
  --line:rgba(127,216,255,.18);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
}

/* ---------- 1. 舞台：字符流画布 ---------- */
.stage{
  position:fixed;inset:0;z-index:0;overflow:hidden;
  background:
    radial-gradient(120% 90% at 50% 42%, #0C1626 0%, #070C15 42%, var(--bg) 78%);
}
#flow{position:absolute;inset:0;width:100%;height:100%;display:block}

/* 中心瞳孔：字符从这里涌出。压暗中心让标题永远读得清。
   压得太狠会把字符流主体一起吃掉 —— 罩子的有效半径要小、浓度要低，
   否则整屏只剩稀疏几点，看不出「放射」。 */
.pupil{
  position:absolute;left:50%;top:50%;width:min(46vw,600px);aspect-ratio:1;
  transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(circle, rgba(4,6,10,.88) 0%, rgba(4,6,10,.62) 30%, rgba(4,6,10,0) 62%);
}
/* 极细网格：给纯黑背景一点结构，不抢戏 */
.grid{
  position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:
    linear-gradient(to right, rgba(127,216,255,.045) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(127,216,255,.045) 1px, transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(110% 85% at 50% 46%, #000 0%, rgba(0,0,0,.3) 55%, transparent 82%);
  mask-image:radial-gradient(110% 85% at 50% 46%, #000 0%, rgba(0,0,0,.3) 55%, transparent 82%);
}
/* 边缘压暗，把视线收进中心 */
.vignette{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(72% 62% at 50% 48%, rgba(4,6,10,0) 0%, rgba(4,6,10,.5) 74%, rgba(4,6,10,.86) 100%);
}

/* ---------- 2. 内容层 ---------- */
.wrap{position:relative;z-index:2;min-height:100dvh;display:flex;flex-direction:column}

.topbar{
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  padding:clamp(14px,2vw,22px) clamp(16px,3.4vw,40px);
}
.brand{
  font-family:var(--mono);font-size:12px;letter-spacing:.32em;color:var(--ink);
  text-decoration:none;text-transform:uppercase;
}
.toplink{
  font-size:12.5px;color:var(--ink-2);text-decoration:none;
  border-bottom:1px solid transparent;padding-bottom:2px;
  transition:color .2s ease,border-color .2s ease;
}
.toplink:hover{color:var(--ink);border-bottom-color:var(--line)}
.toplink:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:2px}

.stage-main{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:0 20px;
}

/* ---------- 3. 手写标题（SVG 描边逐字浮现） ---------- */
.wordmark{
  display:block;width:clamp(230px,42vw,460px);height:auto;
  overflow:visible;
  margin:0 auto;
}
.wordmark .wm-path{
  fill:none;stroke:var(--accent);stroke-width:7.5;
  stroke-linecap:round;stroke-linejoin:round;
  /* 描边推进：由 dashoffset 归零控制，JS 逐字推进。
     注意长度与偏移必须走 CSS 变量 —— 若用内联 style 写死，
     内联优先级高于 .is-drawn 类，归零动画就永远不会生效。 */
  stroke-dasharray:var(--len, none);
  stroke-dashoffset:var(--len, 0);
  transition:stroke-dashoffset 1.15s cubic-bezier(.55,.06,.28,1);
}
.wordmark .wm-path.is-drawn{stroke-dashoffset:0}
/* 无 JS 时路径必须可见（渐进增强） */
html.no-js .wordmark .wm-path{stroke-dasharray:none;stroke-dashoffset:0}

/* 标题下方的 slogan */
.slogan{
  margin:clamp(20px,3.4vh,34px) 0 0;
  font-size:clamp(15px,1.9vw,21px);line-height:1.6;color:var(--ink);
  letter-spacing:.02em;
}
.slogan em{
  font-style:normal;color:var(--accent);
}
/* 关键词行 */
.keys{
  list-style:none;margin:clamp(14px,2.4vh,22px) 0 0;padding:0;
  display:flex;flex-wrap:wrap;gap:10px;justify-content:center;
}
.keys li{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.14em;
  color:var(--ink-2);padding:6px 13px;border-radius:999px;
  border:1px solid var(--line);background:rgba(127,216,255,.04);
}
.keys li b{color:var(--accent);font-weight:600}

/* ---------- 4. 仿真终端（点缀 2） ----------
   桌面端：浮在右下角，不占文档流，首屏因此保持 100dvh 单屏。
   窄屏端：回到文档流（见 @media），因为 .wrap 是 min-height:100dvh，
   浮在外的元素会被推到首屏之外。 */
.term{
  position:fixed;right:clamp(14px,3vw,40px);bottom:clamp(52px,7vh,76px);
  z-index:3;width:min(360px,42vw);
  border:1px solid var(--line);border-radius:10px;
  background:rgba(7,12,21,.82);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  box-shadow:0 18px 50px rgba(0,0,0,.55);
  font-family:var(--mono);font-size:11.5px;line-height:1.72;
  overflow:hidden;text-align:left;
}
.term-bar{
  display:flex;align-items:center;gap:8px;
  padding:8px 12px;border-bottom:1px solid rgba(127,216,255,.12);
  background:rgba(127,216,255,.04);
}
.term-dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.term-dot:nth-child(1){background:#3A4A5C}
.term-dot:nth-child(2){background:#3A4A5C}
.term-dot:nth-child(3){background:#3A4A5C}
.term-title{
  margin-left:4px;font-size:10.5px;color:var(--ink-3);letter-spacing:.08em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.term-body{
  padding:11px 13px 13px;margin:0;
  height:158px;overflow:hidden;
  color:var(--ink-2);white-space:pre-wrap;word-break:break-all;
}
.term-body .c-prompt{color:var(--accent)}
.term-body .c-cmd{color:var(--ink)}
.term-body .c-ok{color:#8FE3A8}
.term-body .c-dim{color:var(--ink-3)}
.term-body .c-cursor{
  display:inline-block;width:7px;height:1.05em;vertical-align:-2px;
  background:var(--accent);animation:blink 1.05s steps(1,end) infinite;
}
@keyframes blink{0%,50%{opacity:1}50.01%,100%{opacity:0}}

/* ---------- 5. CTA ---------- */
.cta{
  margin-top:clamp(22px,3.4vh,32px);
  display:flex;gap:12px;flex-wrap:wrap;justify-content:center;
}
.btn{
  display:inline-flex;align-items:center;justify-content:center;
  min-height:46px;padding:0 24px;border-radius:10px;
  font-size:14.5px;font-weight:500;text-decoration:none;white-space:nowrap;
  transition:transform .18s ease,background-color .18s ease,border-color .2s ease;
}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.btn-primary{background:var(--accent);color:#04121C;border:1px solid transparent}
.btn-primary:hover{background:#A6E4FF;transform:translateY(-1px)}
.btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn-ghost:hover{border-color:rgba(127,216,255,.42);transform:translateY(-1px)}
.note{margin:13px 0 0;font-size:12px;line-height:1.7;color:var(--ink-3)}

/* ---------- 6. 动效开关 ---------- */
.motion-toggle{
  display:inline-flex;align-items:center;gap:7px;
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;
  color:var(--ink-2);background:transparent;cursor:pointer;
  border:1px solid var(--line);border-radius:999px;padding:6px 12px;
  transition:color .2s ease,border-color .2s ease;
}
.motion-toggle:hover{color:var(--ink);border-color:rgba(127,216,255,.4)}
.motion-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.motion-dot{
  width:7px;height:7px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 8px rgba(127,216,255,.7);
  transition:background-color .2s ease,box-shadow .2s ease;
}
.motion-toggle[aria-pressed="false"] .motion-dot{background:var(--ink-3);box-shadow:none}
.motion-toggle[aria-pressed="false"]{color:var(--ink-3)}

/* ---------- 7. 备案信息页脚 ---------- */
.foot{
  position:fixed;left:0;right:0;bottom:0;z-index:4;
  padding:0 16px calc(10px + env(safe-area-inset-bottom,0px));
  text-align:center;font-size:11px;line-height:1.8;letter-spacing:.05em;
  /* 11px 是小字，对比度门槛 4.5 —— 用实色而不是半透明 */
  color:#8FA3B8;pointer-events:none;
}
.foot a{
  color:#B6C7D8;pointer-events:auto;text-decoration:none;
  border-bottom:1px solid rgba(182,199,216,.36);padding-bottom:1px;
  transition:color .2s ease,border-color .2s ease;
}
.foot a:hover{color:#E4EFF8;border-bottom-color:rgba(228,239,248,.66)}
.site-info-sep{margin:0 8px;color:rgba(143,163,184,.5)}
.site-info-pending{color:#8FA3B8}

/* ---------- 8. 响应式 ---------- */
/* 窄屏：终端从浮层改为文档流里的横条，标题与 slogan 优先。
   此时页面允许纵向滚动 —— 内容（标题+文案+CTA+终端）装不进 844px。 */
@media (max-width:900px){
  .term{
    position:static;width:auto;margin:0 16px clamp(18px,3vh,28px);
    font-size:11px;
  }
  .term-body{height:112px;padding:9px 11px 11px}
  .stage-main{padding-bottom:clamp(16px,3vh,26px)}
  .pupil{width:min(84vw,520px)}
  /* 窄屏内容更高，允许滚动；同时给底部页脚留出空间 */
  body{overflow-y:auto}
  .wrap{min-height:100dvh}
  /* 页脚从 fixed 改为 static：容器本身不吃点击，但备案号链接必须可点 */
  .foot{
    position:static;display:block;
    padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));
  }
  .foot a{pointer-events:auto}
}
@media (max-width:560px){
  .keys{gap:8px}
  .keys li{font-size:11px;padding:5px 11px}
  .wordmark{width:min(78vw,300px)}
  .note{font-size:11.5px}
}

/* ---------- 9. 动效降级 ---------- */
@media (prefers-reduced-motion:reduce){
  .wordmark .wm-path{transition:none}
  .term-body .c-cursor{animation:none}
  .btn,.toplink,.foot a,.motion-toggle{transition:none}
}
</style>

<script>
(function(){
  'use strict';

  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var STILL = /[?&]still=1/.test(location.search) || reduce;

  /* =========================================================
     A. Canvas ASCII 字符流（主特效）
     ------------------------------------------------------------
     字符从中心「瞳孔」向外放射，沿途流动、逐渐淡出消散。

     性能要点（这是选 Canvas 而不是 DOM 的原因）：
       · 字形图集（glyph atlas）：所有 ASCII 字符先预渲染到一张
         离屏 canvas 上，运行时只做 drawImage —— 比每帧 fillText
         快一个数量级，这是字符雨能跑满 60fps 的关键。
       · 按透明度分档批量绘制，减少状态切换。
       · 粒子上限随视口面积与设备能力缩放，窄屏再砍一档。
     ========================================================= */
  var canvas = document.getElementById('flow');
  var ctx = canvas.getContext('2d', { alpha: true });

  var GLYPHS = '01{}[]()<>/\\|=+-*#@$%&~^!?.,:;'.split('');
  var ATLAS_COLS = 16;
  var CELL = 13;             // 图集单元（CSS px）

  var W = 0, H = 0, DPR = 1, CX = 0, CY = 0;
  var atlas = null, atlasRows = 0;
  var waves = [], raf = 0, last = 0, running = false, started = false;
  var frames = 0, maxChars = 0, isMobile = false;
  var mouse = { x: -9999, y: -9999, active: false };
  // 波前平均寿命：用来反推波前周期，保证屏幕上稳定保持 WAVES_ALIVE 道环。
  // 必须与 makeWave() 里的 life 区间一致（1.9~2.5 → 均值 2.2）。
  var AVG_TTL = 2.2;

  var ALPHA_LEVELS = [0.22, 0.4, 0.58, 0.78, 0.92, 1.0];

  function rand(a, b){ return a + Math.random() * (b - a); }

  // 固定种子：静态构图要可复现
  function mulberry32(a){
    return function(){
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      var t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  var rnd = Math.random;
  function srnd(a, b){ return a + rnd() * (b - a); }

  /* ---------- 字形图集 ---------- */
  function buildAtlas(){
    var rows = Math.ceil(GLYPHS.length / ATLAS_COLS);
    var c = document.createElement('canvas');
    c.width = ATLAS_COLS * CELL * DPR;
    c.height = rows * CELL * DPR;
    var g = c.getContext('2d');
    g.scale(DPR, DPR);
    g.fillStyle = '#7FD8FF';
    g.font = '11px ' + 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace';
    g.textAlign = 'center';
    g.textBaseline = 'middle';
    for (var i = 0; i < GLYPHS.length; i++){
      var col = i % ATLAS_COLS, row = Math.floor(i / ATLAS_COLS);
      g.fillText(GLYPHS[i], col * CELL + CELL / 2, row * CELL + CELL / 2);
    }
    atlas = c;
    atlasRows = rows;
  }

  /* ---------- 粒子 ---------- */
  // 字符从中心诞生，沿**固定射线**向外加速，抵达屏幕边缘后消散。
  //
  // 关键设计：方向必须可见，否则就是「下雨」而不是「从瞳孔放射」。
  //   · 角度固定（只允许极轻微旋涡，±4°），轨迹是一条条从中心发散的射线
  //   · 带 2 段拖尾残影 —— 残影是让「流动方向」被眼睛读出来的关键
  //   · 速度随半径增长：近处慢、远处快，观感是「涌出」而非「平移」
  /* ---------- 波前（粒子系统） ----------
     为什么是「波前」而不是独立粒子：
     独立粒子各随机角度、各随机寿命 —— 任意时刻的快照必然是均匀散布，
     看起来就是「下雨」，读不出「从中心放射」。
     改成波前后，同一批字符从中心一起涌出、一起向外扩散、一起消散，
     任意时刻都存在几道同心环 —— 放射结构才被眼睛读到。
  */
  var waves = [];          // 每一道波前
  var waveAcc = 0;         // 波前生成计时
  var waveInterval = 420;  // 每隔多久涌出一批
  var charsPerWave = 26;   // 每批多少个字符
  var guardBox = null;     // 中心内容保护区（resize 时量一次）

  // 量一次中心内容块的包围盒，供每帧做保护区淡出判断
  function measureGuard(){
    var el = document.querySelector('.stage-main');
    if (!el){ guardBox = null; return; }
    var b = el.getBoundingClientRect();
    guardBox = { x0: b.left - 20, y0: b.top - 18, x1: b.right + 20, y1: b.bottom + 18 };
  }

  function makeWave(){
    var w = {
      r: 26,                        // 当前半径
      speed: srnd(300, 370),        // 扩散速度
      spin: srnd(-0.30, 0.30),      // 整体旋转（慢螺旋）
      angle: srnd(0, Math.PI * 2),  // 整体旋转角
      age: 0,                       // 存活时长
      life: srnd(1.9, 2.5),         // 寿命：与字符 ttl 同量级
      chars: []
    };
    var a0 = srnd(0, Math.PI * 2);
    for (var i = 0; i < charsPerWave; i++){
      w.chars.push({
        angOff: a0 + (i / charsPerWave) * Math.PI * 2 + srnd(-0.13, 0.13),
        rOff: srnd(-9, 9),
        rJit: 0,                    // 鼠标排斥造成的临时径向偏移
        gi: (Math.random() * GLYPHS.length) | 0,
        size: srnd(0.8, 1.24),
        life: 0,
        ttl: w.life * srnd(0.94, 1.02),   // 与波前同寿命，避免出现空环
        x: 0, y: 0, t1x: 0, t1y: 0, t2x: 0, t2y: 0,
        guard: 1            // 中心保护区衰减系数，1 = 完全可见
      });
    }
    return w;
  }

  function resize(){
    W = window.innerWidth;
    H = window.innerHeight;
    isMobile = W < 760;
    DPR = Math.min(window.devicePixelRatio || 1, isMobile ? 1.5 : 2);
    canvas.width = Math.floor(W * DPR);
    canvas.height = Math.floor(H * DPR);
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    CX = W / 2; CY = H / 2;
    buildAtlas();
    // 字符总预算：桌面密一些，窄屏砍到桌面的一半以内（低端机不卡死）。
    // 每个字符要画 3 次（头部 + 2 段残影），所以比「纯字符雨」低。
    var area = Math.min(1, (W * H) / (1440 * 900));
    maxChars = Math.round((isMobile ? 60 : 130) + area * (isMobile ? 60 : 150));
    // 同屏波前数固定为 4（决定「几道同心环」这个视觉结构，与屏幕无关），
    // 每波字符数 = 预算 / 波前数（决定每道环的连续度，随屏幕缩放）。
    // 注意：波前数不能跟着预算缩放，否则窄屏只剩 2 道环，放射结构就塌了。
    var WAVES_ALIVE = 4;
    charsPerWave = Math.max(8, Math.round(maxChars / WAVES_ALIVE));
    // 波前周期：让一个波前正好活完一轮，屏幕上稳定保持 WAVES_ALIVE 道环
    waveInterval = (AVG_TTL * 1000) / WAVES_ALIVE;
    measureGuard();
  }

  function update(dt, now){
    // 成批涌出下一道波前
    waveAcc += dt * 1000;
    while (waveAcc >= waveInterval){
      waveAcc -= waveInterval;
      waves.push(makeWave());
    }

    var maxR = Math.sqrt(W * W + H * H) * 0.5 + 40;

    // 中心内容保护区：字符经过这里要淡出，否则环经过顶部时会在
    // 标题上方压出一条水平亮带，破坏中心的留白。
    // 保护范围是「标题 + slogan + 关键词 + CTA」整块，不是只挡标题。
    // 尺寸只在 resize 时量一次 —— 每帧调 getBoundingClientRect 会强制
    // 重排，是 Canvas 页最经典的性能陷阱。
    var wmBox = guardBox;
    for (var wi = waves.length - 1; wi >= 0; wi--){
      var w = waves[wi];
      w.r += w.speed * dt;
      w.angle += w.spin * dt;
      w.age += dt;
      // 波前的存活按**时间**判定，不按半径。
      // 若按半径移除，窄屏（视口小、边缘近）会比桌面更早丢掉波前，
      // 同屏只剩 2 道环 —— 放射结构在窄屏就塌了。
      var waveDead = w.age >= w.life;

      for (var ci = 0; ci < w.chars.length; ci++){
        var c = w.chars[ci];
        c.life += dt;
        if (c.life >= c.ttl || waveDead){
          c.dead = true;
          continue;
        }

        var ang = w.angle + c.angOff;
        var r = w.r + c.rOff + c.rJit;

        // 拖尾残影：保存前两帧位置，绘制时补上
        c.t2x = c.t1x; c.t2y = c.t1y;
        c.t1x = c.x; c.t1y = c.y;

        // 鼠标排斥：字符被推开一点（不做吸引，吸引会把标题糊住）
        if (mouse.active){
          var mx = c.x + CX - mouse.x, my = c.y + CY - mouse.y;
          var md = Math.sqrt(mx * mx + my * my);
          if (md < 170 && md > 0.01){
            c.rJit += (1 - md / 170) * 40 * dt;
          }
        }
        c.rJit *= (1 - 2.6 * dt);   // 弹回原位
        if (c.rJit > 14) c.rJit = 14; else if (c.rJit < -14) c.rJit = -14;

        c.x = Math.cos(ang) * r;
        c.y = Math.sin(ang) * r;

        // 落在中心保护区里 → 这一笔不画。
        // 用软过渡（靠近边缘保留、越深越淡）而不是硬剔除，
        // 否则环会在保护区边界切出一道生硬的分界线。
        c.guard = 1;
        if (wmBox){
          var sx = c.x + CX, sy = c.y + CY;
          if (sx > wmBox.x0 && sx < wmBox.x1 && sy > wmBox.y0 && sy < wmBox.y1){
            var dx = Math.min(sx - wmBox.x0, wmBox.x1 - sx);
            var dy = Math.min(sy - wmBox.y0, wmBox.y1 - sy);
            var depth = Math.min(dx, dy);
            // 边缘 26px 内线性淡出，越深入越透明
            c.guard = Math.min(1, depth / 26);
          }
        }
      }

      if (waveDead) waves.splice(wi, 1);
    }
  }

  function draw(){
    ctx.clearRect(0, 0, W, H);

    // 按透明度分档批量绘制：一次 setAlpha 画一批，减少状态切换
    var buckets = [];
    for (var b = 0; b < ALPHA_LEVELS.length; b++) buckets.push([]);

    function push(x, y, gi, size, a){
      if (a <= 0.02) return;
      var lv = Math.min(ALPHA_LEVELS.length - 1, (a * ALPHA_LEVELS.length) | 0);
      buckets[lv].push(x, y, gi, size);
    }

    var maxR = Math.sqrt(W * W + H * H) * 0.5 + 40;

    for (var wi = 0; wi < waves.length; wi++){
      var w = waves[wi];
      // 越往外越淡 —— 「消散」发生在环的外缘。
      // 衰减起点放在 55% 半径处：环在到达外缘前始终保有足够亮度，
      // 边缘才有清晰的一圈，而不是整屏均匀的雾。
      var edge = 1 - Math.min(1, Math.max(0, (w.r - maxR * 0.55) / (maxR * 0.45)));
      edge = edge * edge;
      for (var ci = 0; ci < w.chars.length; ci++){
        var c = w.chars[ci];
        if (c.dead) continue;
        var t = c.life / c.ttl;
        var fadeIn = Math.min(1, t / 0.09);   // 出瞳孔时迅速亮起
        var fadeOut = Math.min(1, (1 - t) / 0.28);
        var a = fadeIn * fadeOut * edge * c.guard;
        if (a <= 0.02) continue;
        push(c.x + CX, c.y + CY, c.gi, c.size, a);
        // 两段拖尾残影：让「往哪飞」被眼睛读出来
        push(c.t1x + CX, c.t1y + CY, c.gi, c.size * 0.92, a * 0.42);
        push(c.t2x + CX, c.t2y + CY, c.gi, c.size * 0.84, a * 0.18);
      }
    }

    for (var lv2 = 0; lv2 < buckets.length; lv2++){
      var arr = buckets[lv2];
      if (!arr.length) continue;
      ctx.globalAlpha = ALPHA_LEVELS[lv2];
      for (var s = 0; s < arr.length; s += 4){
        var gx = arr[s], gy = arr[s + 1], gi = arr[s + 2], gs = arr[s + 3];
        var cc = gi % ATLAS_COLS, rr = (gi / ATLAS_COLS) | 0;
        ctx.drawImage(
          atlas,
          cc * CELL * DPR, rr * CELL * DPR, CELL * DPR, CELL * DPR,
          gx - CELL * gs / 2, gy - CELL * gs / 2, CELL * gs, CELL * gs
        );
      }
    }
    ctx.globalAlpha = 1;
  }

  function frame(now){
    if (!running) return;
    frames++;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt, now);
    draw();
    raf = requestAnimationFrame(frame);
  }

  function start(){
    if (started) return;
    started = true;
    resize();
    waves = [];

    if (STILL){
      // 静态终帧：固定种子造几道波前，推进一段固定时间后停帧。
      // 推进 1.9 秒 ≈ 一个完整波前周期，环的层次才铺得开。
      rnd = mulberry32(20261120);
      for (var i = 0; i < 4; i++){
        waves.push(makeWave());
        // 让每道波前已经扩散到不同半径
        for (var s = 0; s < 24; s++) update(1 / 60, s * 22);
      }
      draw();
      return;
    }

    last = performance.now();
    running = true;
    raf = requestAnimationFrame(frame);
  }

  var resizeTimer = 0;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      resize();          // resize 内部会重量保护区
      if (STILL) draw();
    }, 180);
  });

  window.addEventListener('mousemove', function(e){
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
  });
  window.addEventListener('mouseout', function(){ mouse.active = false; });

  document.addEventListener('visibilitychange', function(){
    if (document.hidden){
      running = false;
      cancelAnimationFrame(raf);
    } else if (!STILL && started){
      running = true;
      last = performance.now();
      raf = requestAnimationFrame(frame);
    }
  });

  /* =========================================================
     B. 手写标题逐字浮现（点缀 1）
     ------------------------------------------------------------
     做法：给每条路径量出总长度设为 dasharray，dashoffset 从
     长度归零 —— 描边就「写」出来了。按字母顺序依次启动，
     视觉上就是笔在写字。
     ========================================================= */
  var wmPaths = Array.prototype.slice.call(document.querySelectorAll('.wm-path'));
  function pathLen(p){
    try { return p.getTotalLength(); } catch (e) { return 0; }
  }
  function drawTitle(){
    wmPaths.forEach(function(p){
      var len = pathLen(p);
      if (!len) { p.classList.add('is-drawn'); return; }
      // 只设 CSS 变量，不写内联 stroke-dashoffset —— 否则内联样式会盖过
      // .is-drawn 类的归零规则，标题永远停在「完全隐藏」。
      p.style.setProperty('--len', len.toFixed(1));
    });
    // 逐条推进；每条留 115ms 间隔，读起来像一笔一笔写
    wmPaths.forEach(function(p, i){
      setTimeout(function(){ p.classList.add('is-drawn'); }, reduce ? 0 : 260 + i * 115);
    });
  }

  /* =========================================================
     C. 仿真终端（点缀 2）
     ------------------------------------------------------------
     自动敲一段命令并输出日志。用 DOM 文本节点逐字推进，
     不做真终端 —— 这里的重点是「氛围」，不是执行能力。
     ========================================================= */
  var termBody = document.getElementById('termBody');
  var TERM_SCRIPT = [
    { t: '$ git clone persist', c: 'c-cmd', d: 0 },
    { t: '', c: 'c-dim', d: 260 },
    { t: 'Cloning into \'persist\'...', c: 'c-dim', d: 120 },
    { t: 'remote: Enumerating objects: 1284, done.', c: 'c-dim', d: 60 },
    { t: 'Receiving objects: 100% (1284/1284), 2.41 MiB', c: 'c-dim', d: 60 },
    { t: 'Resolving deltas: 100% (312/312), done.', c: 'c-dim', d: 300 },
    { t: '$ npm install', c: 'c-cmd', d: 0 },
    { t: 'added 412 packages in 9s', c: 'c-ok', d: 60 },
    { t: '$ npm run dev', c: 'c-cmd', d: 0 },
    { t: '  ▲ Next.js 15.2.1', c: 'c-dim', d: 80 },
    { t: '  - Local:        http://localhost:3000', c: 'c-dim', d: 40 },
    { t: '', c: 'c-dim', d: 100 },
    { t: '  ✓ ready in 1.4s', c: 'c-ok', d: 200 }
  ];

  function runTerminal(){
    if (!termBody) return;
    if (reduce) {
      // 减动效：直接给最终态，不逐字敲
      var lines = TERM_SCRIPT.map(function(l){
        var s = document.createElement('span');
        s.className = l.c; s.textContent = l.t;
        return s;
      });
      termBody.textContent = '';
      lines.forEach(function(s){ termBody.appendChild(s); termBody.appendChild(document.createTextNode('\n')); });
      trimTerm();
      return;
    }
    var idx = 0;
    function nextLine(){
      if (idx >= TERM_SCRIPT.length) return;
      var line = TERM_SCRIPT[idx++];
      var span = document.createElement('span');
      span.className = line.c;
      termBody.appendChild(span);
      var chars_ = line.t, ci = 0;
      function type(){
        if (ci < chars_.length){
          span.textContent += chars_[ci++];
          setTimeout(type, 14);
        } else {
          termBody.appendChild(document.createTextNode('\n'));
          // 光标跟在最后一行
          var cur = termBody.querySelector('.c-cursor');
          if (cur) cur.remove();
          var c = document.createElement('span');
          c.className = 'c-cursor';
          termBody.appendChild(c);
          trimTerm();
          setTimeout(nextLine, line.d);
        }
      }
      type();
    }
    nextLine();
  }

  // 终端可视高度有限：行数超出时从顶部移除最早的一行，
  // 保证最新的输出始终可见（像真实终端滚屏），而不是被裁掉。
  function trimTerm(){
    if (!termBody) return;
    var maxH = termBody.clientHeight;
    while (termBody.scrollHeight > maxH && termBody.firstChild){
      termBody.removeChild(termBody.firstChild);
    }
  }

  /* =========================================================
     D. 动效开关
     ------------------------------------------------------------
     用户可以随时关掉动效：字符流停在当前帧、手写标题直接显示
     终态、终端直接给最终输出。选择记在 localStorage。
     ========================================================= */
  var toggle = document.getElementById('motionToggle');
  var motionLabel = document.getElementById('motionLabel');
  var STORE_KEY = 'persist.motion';

  function applyMotion(on){
    if (toggle){
      toggle.setAttribute('aria-pressed', on ? 'true' : 'false');
      if (motionLabel) motionLabel.textContent = on ? '动效 开' : '动效 关';
    }
    if (on){
      if (!STILL && started){ running = true; last = performance.now(); raf = requestAnimationFrame(frame); }
    } else {
      running = false;
      cancelAnimationFrame(raf);
    }
    document.documentElement.setAttribute('data-motion', on ? 'on' : 'off');
  }

  function readStored(){
    try { return localStorage.getItem(STORE_KEY); } catch (e) { return null; }
  }
  function storeMotion(v){
    try { localStorage.setItem(STORE_KEY, v); } catch (e) { /* 隐私模式下忽略 */ }
  }

  /* =========================================================
     E. 启动
     ========================================================= */
  function boot(){
    try { start(); } catch (e) { /* 画布失败不阻断文案 */ }
    try { drawTitle(); } catch (e) {
      for (var i = 0; i < wmPaths.length; i++) wmPaths[i].classList.add('is-drawn');
    }
    try { runTerminal(); } catch (e) { /* 终端失败不阻断页面 */ }

    // 动效开关：默认开；系统减动效偏好或用户上次选择关 → 尊重之
    var stored = readStored();
    var wantOn = stored === null ? !reduce : stored === 'on';
    if (!wantOn){
      // 关动效：手写标题直接终态，终端直接终态
      wmPaths.forEach(function(p){ p.classList.add('is-drawn'); });
      applyMotion(false);
    } else {
      applyMotion(true);
    }

    if (toggle){
      toggle.addEventListener('click', function(){
        var on = toggle.getAttribute('aria-pressed') !== 'true';
        applyMotion(on);
        storeMotion(on ? 'on' : 'off');
      });
    }
  }

  if (document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

  /* ---------- 自检：?selftest=1 输出真实测量值 ---------- */
  // 注意：状态必须能被**实时**读取。动效开关的验收要比较「关掉前后帧数
  // 是否还在涨」，一次性快照做不到这件事 —— 所以对外暴露一个实时取值函数，
  // 自检块只是它在某一时刻的打印。
  function liveState(){
    var wm = document.getElementById('wordmark');
    var wr = wm ? wm.getBoundingClientRect() : null;
    var cta = document.getElementById('cta');
    var cr = cta ? cta.getBoundingClientRect() : null;
    var term = document.getElementById('term');
    var tr = term ? term.getBoundingClientRect() : null;
    // 活字符数：所有波前里还没死的字符
    var alive = 0;
    for (var i = 0; i < waves.length; i++){
      var wc = waves[i].chars;
      for (var j = 0; j < wc.length; j++) if (!wc[j].dead) alive++;
    }
    return {
      dpr: DPR, wrapW: W, wrapH: H,
      chars: alive, maxChars: maxChars, frames: frames, isMobile: isMobile,
      waves: waves.length, charsPerWave: charsPerWave,
      scrollWidth: document.documentElement.scrollWidth,
      clientWidth: document.documentElement.clientWidth,
      wmPaths: wmPaths.length,
      wmDrawn: wmPaths.filter(function(p){ return p.classList.contains('is-drawn'); }).length,
      wmRect: wr ? { top: +wr.top.toFixed(1), bottom: +wr.bottom.toFixed(1), w: +wr.width.toFixed(1) } : null,
      ctaRect: cr ? { top: +cr.top.toFixed(1), bottom: +cr.bottom.toFixed(1) } : null,
      wmInViewport: wr ? (wr.top >= 0 && wr.bottom <= window.innerHeight) : null,
      ctaInViewport: cr ? (cr.top >= 0 && cr.bottom <= window.innerHeight) : null,
      termRect: tr ? { top: +tr.top.toFixed(1), bottom: +tr.bottom.toFixed(1) } : null,
      termText: termBody ? termBody.textContent.length : 0,
      keys: document.querySelectorAll('.keys li').length,
      narrow: W <= 900,
      reduce: reduce, still: STILL,
      motion: document.documentElement.getAttribute('data-motion')
    };
  }
  window.__persistLandingState = liveState;

  (function selftest(){
    if (!/[?&]selftest=1/.test(location.search)) return;
    setTimeout(function(){
      var d = document.createElement('pre');
      d.id = 'selftest';
      d.style.cssText = 'position:fixed;left:0;bottom:0;z-index:9;font:11px monospace;color:#8f8;background:#000a;padding:6px;max-width:100vw;white-space:pre-wrap';
      d.textContent = JSON.stringify(liveState(), null, 2);
      document.body.appendChild(d);
    }, 2600);
  })();
})();
</script>
</body>
